<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Dashboard Financiero</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<!-- Librerías con defer: descargan en paralelo sin bloquear el parseo del HTML.
     React en PRODUCCIÓN (no development) = mucho más rápido y liviano. -->
<script defer src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
<script defer src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" crossorigin="anonymous"></script>
<!-- Firebase SDKs Compat (Requeridos para Dashboard portable) -->
<script defer src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script defer src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script defer src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --g900:oklch(28% .11 155);--g800:oklch(33% .12 155);--g700:oklch(38% .13 155);
  --g600:oklch(44% .14 155);--g500:oklch(52% .15 155);--g400:oklch(60% .14 155);
  --g300:oklch(70% .12 155);--g200:oklch(82% .08 155);--g100:oklch(93% .04 155);
  --g50:oklch(97% .02 155);
  --amber:oklch(72% .18 75);--amber-bg:oklch(97% .04 75);
  --red:oklch(55% .18 25);--red-bg:oklch(97% .03 25);
  --blue:oklch(52% .15 240);--blue-bg:oklch(95% .04 240);
  --bg:oklch(98.5% .005 95);--surface:#fff;
  --border:oklch(91% .01 155);--text:oklch(18% .02 155);
  --t2:oklch(45% .03 155);--t3:oklch(65% .02 155);
  --sw:240px;--sc:64px;
}
html,body{height:100%;font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:subpixel-antialiased;-moz-osx-font-smoothing:auto;text-rendering:geometricPrecision;font-size:14px}
#root{height:100%;display:flex}
.mono{font-family:'DM Sans',sans-serif;font-variant-numeric:tabular-nums;font-feature-settings:'tnum'}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:99px}
@keyframes spin{to{transform:rotate(360deg)}}

/* Sidebar */
.sb{width:var(--sw);min-height:100vh;background:var(--g800);display:flex;flex-direction:column;
  position:fixed;top:0;left:0;z-index:100;overflow:hidden;transition:width .22s cubic-bezier(.4,0,.2,1)}
.sb.col{width:var(--sc)}
.sb-logo{display:flex;align-items:center;gap:12px;padding:22px 20px 16px;white-space:nowrap;overflow:hidden}
.logo-mark{width:32px;height:32px;min-width:32px;background:var(--g400);border-radius:8px;
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:#fff}
.logo-text{font-size:17px;font-weight:700;color:#fff;letter-spacing:-.3px;-webkit-font-smoothing:antialiased}
.sb-sec{padding:0 10px;margin-bottom:2px}
.sb-lbl{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
  color:var(--g400);padding:10px 10px 5px;white-space:nowrap;overflow:hidden;opacity:1;transition:opacity .2s}
.sb.col .sb-lbl{opacity:0}
.ni{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:8px;cursor:pointer;
  color:var(--g300);font-size:13.5px;font-weight:500;white-space:nowrap;overflow:hidden;
  transition:background .14s,color .14s}
.ni:hover{background:rgba(255,255,255,.09);color:#fff}
.ni.act{background:var(--g600);color:#fff}
.ni-icon{width:20px;height:20px;min-width:20px;display:flex;align-items:center;justify-content:center}
.ni-label{overflow:hidden;opacity:1;transition:opacity .2s}
.sb.col .ni-label{opacity:0}
.sb-footer{margin-top:auto;padding:14px 10px;border-top:1px solid rgba(255,255,255,.1)}
.user-pill{display:flex;align-items:center;gap:10px;padding:7px;border-radius:8px;cursor:pointer;transition:background .14s}
.user-pill:hover{background:rgba(255,255,255,.08)}
.avatar{width:30px;height:30px;min-width:30px;background:var(--g500);border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff}
.u-name{font-size:12px;font-weight:600;color:#fff;white-space:nowrap}
.u-role{font-size:11px;color:var(--g400);white-space:nowrap}
.col-btn{margin:0 10px 10px;border:none;background:rgba(255,255,255,.08);color:var(--g200);
  border-radius:8px;cursor:pointer;padding:7px;display:flex;align-items:center;justify-content:center;transition:background .14s}
.col-btn:hover{background:rgba(255,255,255,.14)}

/* Main */
.main{margin-left:var(--sw);flex:1;min-height:100vh;transition:margin-left .22s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column}
.main.col{margin-left:var(--sc)}
.topbar{height:60px;background:var(--surface);border-bottom:1px solid var(--border);
  display:flex;align-items:center;padding:0 24px;gap:14px;position:sticky;top:0;z-index:50}
.tb-title{font-size:17px;font-weight:600;flex:1}
.tb-sub{font-size:12px;color:var(--t3);margin-left:6px;font-weight:400}
.tb-date{font-size:12px;color:var(--t3);font-family:'DM Mono',monospace}
.icon-btn{width:34px;height:34px;display:flex;align-items:center;justify-content:center;
  border:1px solid var(--border);border-radius:8px;cursor:pointer;background:none;color:var(--t2);transition:all .14s}
.icon-btn:hover{background:var(--bg);color:var(--text)}
.badge-dot{width:7px;height:7px;background:var(--amber);border-radius:50%;border:1.5px solid var(--surface);position:absolute;top:6px;right:6px}

/* Page */
.page{padding:24px;overflow-y:auto;flex:1}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse-dot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.7)}}
.page{animation:fadeUp .25s ease both}

/* Cards */
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px 20px}
.card-hd{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:14px}
.card-title{font-size:13.5px;font-weight:600}
.card-sub{font-size:11.5px;color:var(--t3);margin-top:2px}
.card-act{font-size:12px;color:var(--g600);font-weight:500;cursor:pointer;background:none;border:none;
  font-family:inherit;padding:3px 8px;border-radius:6px;transition:background .14s}
.card-act:hover{background:var(--g50)}

/* KPI grid */
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.kpi-grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:20px}
.kpi-grid-5{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:20px}
.kcard{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px 18px;transition:box-shadow .18s}
.kcard:hover{box-shadow:0 4px 14px rgba(0,0,0,.06)}
.kcard-icon{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;margin-bottom:12px}
.kcard-icon.g{background:var(--g100);color:var(--g700)}
.kcard-icon.a{background:var(--amber-bg);color:var(--amber)}
.kcard-icon.r{background:var(--red-bg);color:var(--red)}
.kcard-icon.b{background:var(--blue-bg);color:var(--blue)}
.kcard-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--t3);margin-bottom:6px}
.kcard-val{font-size:21px;font-weight:500;font-family:'DM Sans',sans-serif;letter-spacing:-.03em;line-height:1}
.kcard-val.lg{font-size:18px}
.kcard-change{display:flex;align-items:center;gap:3px;margin-top:5px;font-size:11.5px;font-weight:500}
.kcard-change.up{color:var(--g600)}
.kcard-change.dn{color:var(--red)}
.kcard-change.neu{color:var(--t3)}
.kcard-change .sub{color:var(--t3);font-weight:400}

/* Grids */
.g2{display:grid;grid-template-columns:2fr 1fr;gap:14px;margin-bottom:20px}
.g2r{display:grid;grid-template-columns:1fr 2fr;gap:14px;margin-bottom:20px}
.g11{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:20px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-bottom:20px}
.mb{margin-bottom:14px}

/* Table */
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--t3);
  padding:0 10px 9px;text-align:left;white-space:nowrap}
.tbl td{padding:9px 10px;border-top:1px solid var(--border);vertical-align:middle;font-size:13.5px}
.tbl tr:hover td{background:var(--bg)}
.tbl .r{text-align:right}
.pill{display:inline-flex;align-items:center;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:600;white-space:nowrap}
.pill.g{background:var(--g100);color:var(--g700)}
.pill.a{background:var(--amber-bg);color:oklch(50% .17 75)}
.pill.r{background:var(--red-bg);color:var(--red)}
.pill.gr{background:var(--bg);color:var(--t3);border:1px solid var(--border)}

/* Bar progress */
.bar-wrap{flex:1;height:5px;background:var(--border);border-radius:99px;overflow:hidden}
.bar-fill{height:100%;border-radius:99px;transition:width .7s cubic-bezier(.4,0,.2,1)}

/* Saldo list */
.saldo-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--border)}
.saldo-row:first-child{border-top:none;padding-top:0}
.saldo-banco{font-size:13px;font-weight:500;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.saldo-amt{font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;min-width:90px;text-align:right;color:var(--text)}

/* Donut */
.donut-wrap{display:flex;align-items:center;gap:18px}
.donut-leg{flex:1;display:flex;flex-direction:column;gap:7px}
.dl-row{display:flex;align-items:center;justify-content:space-between}
.dl-name{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--t2)}
.dl-val{font-size:12px;font-family:'DM Mono',monospace;color:var(--t2)}

/* Tabs */
.tabs{display:flex;gap:3px;margin-bottom:18px;background:var(--bg);border:1px solid var(--border);
  border-radius:9px;padding:3px;width:fit-content}
.tab{padding:6px 16px;font-size:12.5px;font-weight:500;border-radius:7px;cursor:pointer;
  border:none;background:none;color:var(--t3);font-family:inherit;transition:all .14s}
.tab.act{background:var(--surface);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.07)}
.tab:hover:not(.act){color:var(--text)}

/* Legend */
.leg{display:flex;gap:14px;margin-bottom:10px;flex-wrap:wrap}
.leg-i{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--t2)}
.leg-line{width:14px;height:2px;border-radius:2px}


/* ── Home Page ───────────────────────────────────────────────────────────── */
.home-hero{background:linear-gradient(135deg,var(--g800) 0%,var(--g700) 60%,oklch(38% .16 160) 100%);border-radius:16px;padding:28px 32px;margin-bottom:20px;color:#fff;position:relative;overflow:hidden}
.home-hero::before{content:'';position:absolute;top:-40px;right:-40px;width:220px;height:220px;background:rgba(255,255,255,.04);border-radius:50%}
.home-hero::after{content:'';position:absolute;bottom:-60px;right:80px;width:160px;height:160px;background:rgba(255,255,255,.03);border-radius:50%}
.hero-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px;margin-top:20px}
.hero-stat{background:rgba(255,255,255,.08);border-radius:10px;padding:14px 16px;backdrop-filter:blur(4px)}
.hero-stat-label{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:rgba(255,255,255,.55);margin-bottom:6px}
.hero-stat-val{font-family:'DM Sans',sans-serif;font-size:20px;font-weight:700;color:#fff;letter-spacing:-.02em}
.hero-stat-sub{font-size:11px;color:rgba(255,255,255,.5);margin-top:3px}
.home-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.home-grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-bottom:14px}
.trend-chip{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:600;padding:2px 7px;border-radius:99px}
.trend-chip.up{background:rgba(var(--g600-rgb,.5),0.15);color:var(--g300)}
.trend-chip.dn{background:rgba(220,50,50,.15);color:#ff8080}
.trend-chip.neu{background:rgba(255,255,255,.1);color:rgba(255,255,255,.6)}
/* ── Alerts ──────────────────────────────────────────────────────────────── */
.alert-strip{display:flex;flex-wrap:wrap;gap:6px;padding:0 20px 10px}
.alert-chip{display:flex;align-items:center;gap:6px;padding:5px 10px 5px 8px;border-radius:7px;font-size:12px;border:1px solid transparent;line-height:1.3}
.alert-chip.warn{background:var(--amber-bg);border-color:oklch(72% .18 75);color:oklch(40% .17 75)}
.alert-chip.crit{background:var(--red-bg);border-color:var(--red);color:var(--red)}
.alert-chip.info{background:var(--blue-bg);border-color:var(--blue);color:var(--blue)}
.alert-chip-icon{font-size:12px;flex-shrink:0}
.alert-chip-txt{font-weight:700}
.alert-chip-sub{font-weight:400;opacity:.85}
.alert-close{background:none;border:none;cursor:pointer;color:currentColor;padding:0 0 0 5px;font-size:15px;line-height:1;opacity:.55;flex-shrink:0}
.alert-close:hover{opacity:1}
/* ── Alert Config Panel ─────────────────────────────────────────────────── */
.alert-cfg{position:fixed;bottom:20px;right:20px;z-index:250;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px;width:280px;box-shadow:0 8px 28px rgba(0,0,0,.13)}
.alert-cfg-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.alert-cfg-title{font-size:13px;font-weight:700}
.cfg-row{margin-bottom:12px}
.cfg-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--t3);margin-bottom:5px}
.cfg-banco{display:flex;align-items:center;justify-content:space-between;padding:6px 0;border-top:1px solid var(--border)}
.cfg-banco:first-child{border-top:none}
.cfg-banco-name{font-size:12.5px;font-weight:500}
.cfg-input{width:90px;padding:4px 8px;font-size:12px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text);font-family:'DM Mono',monospace;text-align:right}
/* ── Upload Panel ────────────────────────────────────────────────────────── */
.upload-zone{border:2px dashed var(--border);border-radius:12px;padding:28px;text-align:center;cursor:pointer;transition:all .18s;background:var(--bg)}
.upload-zone:hover,.upload-zone.drag{border-color:var(--g500);background:var(--g50)}
.upload-icon{width:42px;height:42px;border-radius:12px;background:var(--g100);color:var(--g700);display:flex;align-items:center;justify-content:center;margin:0 auto 10px}
.upload-title{font-size:13.5px;font-weight:600;margin-bottom:4px}
.upload-sub{font-size:12px;color:var(--t3)}
.upload-progress{height:4px;background:var(--border);border-radius:99px;overflow:hidden;margin-top:12px}
.upload-progress-fill{height:100%;background:var(--g600);border-radius:99px;transition:width .3s}
.file-chip{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--g50);border:1px solid var(--g200);border-radius:8px;margin-top:10px}
.file-chip-icon{color:var(--g600)}
.file-chip-name{font-size:12.5px;font-weight:500;flex:1}
.file-chip-size{font-size:11.5px;color:var(--t3);font-family:'DM Mono',monospace}

/* Tweak panel */
.tweak-panel{position:fixed;bottom:20px;right:20px;z-index:200;background:var(--surface);
  border:1px solid var(--border);border-radius:12px;padding:16px;width:220px;
  box-shadow:0 8px 28px rgba(0,0,0,.11);display:none}
.tweak-panel.open{display:block}
.tweak-title{font-size:12.5px;font-weight:700;margin-bottom:12px}
.tweak-lbl{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--t3);margin-bottom:5px}
.tweak-opts{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px}
.tweak-opt{padding:4px 10px;font-size:11.5px;font-weight:500;border:1px solid var(--border);
  border-radius:6px;cursor:pointer;background:none;color:var(--t2);font-family:inherit;transition:all .14s}
.tweak-opt.act{background:var(--g700);color:#fff;border-color:var(--g700)}
.tweak-opt:hover:not(.act){border-color:var(--g400);color:var(--g700)}

/* ── ESTILOS DEL SIMULADOR Y DEL ANALISTA IA ── */
.ai-gradient-card {
  background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%) !important;
  border: 1px solid #bfdbfe !important;
  border-radius: 14px !important;
  box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05) !important;
}
.ai-avatar-glowing {
  width: 44px;
  height: 44px;
  background: linear-gradient(135deg, var(--blue) 0%, #1e40af 100%);
  color: white;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.3rem;
  box-shadow: 0 0 15px rgba(37,99,235,0.4);
  animation: pulseGlow 2.5s infinite;
}
@keyframes pulseGlow {
  0% { box-shadow: 0 0 10px rgba(37,99,235,0.3); }
  50% { box-shadow: 0 0 20px rgba(37,99,235,0.6); }
  100% { box-shadow: 0 0 10px rgba(37,99,235,0.3); }
}
.ai-report-content {
  font-size: 13.5px;
  line-height: 1.6;
  color: var(--text);
}
.ai-report-content p {
  margin-bottom: 12px;
}
.ai-alert-item {
  display: flex;
  gap: 12px;
  padding: 12px 14px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--surface);
  margin-bottom: 10px;
  box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
}
.ai-alert-item.danger { border-color: var(--red); background: var(--red-bg); }
.ai-alert-item.warning { border-color: var(--amber); background: var(--amber-bg); }
.ai-alert-item.success { border-color: var(--g600); background: var(--g50); }

.ai-alert-icon { font-size: 1.2rem; flex-shrink: 0; }
.ai-alert-item.danger .ai-alert-icon { color: var(--red); }
.ai-alert-item.warning .ai-alert-icon { color: oklch(50% .17 75); }
.ai-alert-item.success .ai-alert-icon { color: var(--g600); }

.ai-alert-title { font-weight: 700; font-size: 13px; margin-bottom: 3px; }
.ai-alert-desc { font-size: 12px; color: var(--t2); line-height: 1.4; }

.ai-query-suggestions { display: flex; flex-direction: column; gap: 8px; }
.ai-query-tag {
  padding: 8px 12px;
  font-size: 12.5px;
  font-weight: 500;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--bg);
  color: var(--text);
  cursor: pointer;
  transition: all .14s;
  text-align: left;
}
.ai-query-tag:hover {
  background: var(--blue-bg);
  border-color: var(--blue);
  color: var(--blue);
}
.ai-chat-bubble {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 14px 16px;
  box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
}

/* Simulator Styles */
.sim-layout {
  display: grid;
  grid-template-columns: 310px 1fr;
  gap: 16px;
  align-items: start;
}
.sim-controls {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 18px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.sim-group { display: flex; flex-direction: column; gap: 6px; }
.sim-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--t3); }
.sim-checkbox-label {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12.5px;
  font-weight: 500;
  color: var(--text);
  cursor: pointer;
  user-select: none;
}
.sim-checkbox-label input { width: 15px; height: 15px; accent-color: var(--blue); }
.sim-slider-container { display: flex; flex-direction: column; gap: 4px; }
.sim-slider { width: 100%; accent-color: var(--blue); cursor: pointer; }
.sim-slider-labels { display: flex; justify-content: space-between; font-size: 10px; color: var(--t3); font-weight: 500; }
.sim-summary-box {
  padding: 12px 14px;
  border-radius: 9px;
  border: 1px solid var(--border);
  background: var(--bg);
}

/* Animación premium de pulsación */
@keyframes cardPulse {

const getSavedFirebaseConfig = () => {
  // 1. Usar la configuración directa si ya configuraste tus datos reales
  if (DEFAULT_FIREBASE_CONFIG && DEFAULT_FIREBASE_CONFIG.apiKey !== "TU_API_KEY_REAL" && DEFAULT_FIREBASE_CONFIG.projectId !== "tu-proyecto") {

const isFirebaseAvailable = () => {
  return typeof firebase !== 'undefined' && getSavedFirebaseConfig() !== null;
};

const initFirebaseInstance = (onUserChanged, onSyncData) => {
  if (typeof firebase === 'undefined') {
    console.warn("Firebase SDK no cargado.");
    return null;
  }
  const config = getSavedFirebaseConfig();
  if (!config) {
    console.log("No se encontró configuración de Firebase en LocalStorage.");
    return null;
  }

  try {
    if (firebase.apps.length === 0) {
      firebaseApp = firebase.initializeApp(config);
    } else {
      firebaseApp = firebase.app();
    }
    
    db = firebaseApp.firestore();
    console.log("🔥 Firebase Firestore inicializado con éxito. Conectado a (default).");

    firebase.auth().getRedirectResult().then((result) => {
      if (result && result.credential) {
        const token = result.credential.accessToken;
        sessionStorage.setItem('google_access_token', token);
        window.googleAccessToken = token;
        console.log("🎟️ Google access token stored from redirect");
      }
    }).catch((error) => {
      console.error("Error getting redirect result:", error);
    });

    firebase.auth().onAuthStateChanged((user) => {
      onUserChanged(user);
      if (user) {
        startRealtimeSync(user.uid, onSyncData);
      } else {
        if (firebaseUnsubscribe) {
          firebaseUnsubscribe();
          firebaseUnsubscribe = null;
        }
      }
    });

    return firebaseApp;
  } catch (error) {
    console.error("Error al conectar Firebase:", error);
    return null;
  }
};

const startRealtimeSync = (uid, onSyncData) => {
  if (!db) return;
  if (firebaseUnsubscribe) firebaseUnsubscribe();

  firebaseUnsubscribe = db.collection("users").doc(uid).onSnapshot((doc) => {
    if (doc.exists) {
      const cloudData = doc.data() || {};
      onSyncData(cloudData);
    } else {
      const initialTemplate = {
        settings: { theme: 'light', currency: 'CLP', geminiApiKey: '' },
        umbrales: {
          minCajaConsolidada: 20000000,
          maxDiasVencimientoCobranza: 30,
          minRunwayDias: 90,
          diasAlertaVencimientoCreditos: 7
        },
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      };
      db.collection("users").doc(uid).set(initialTemplate, { merge: true });
    }
  }, (error) => {
    console.error("Error en sincronización en tiempo real:", error);
  });
};

const saveConfigToCloud = async (settings, umbrales, customData = {}) => {
  const user = firebase.auth().currentUser;
  if (!user || !db) return;

  const withTimeout = (promise, ms, name) => {
    let timeoutId;
    const timeoutPromise = new Promise((_, reject) => {
      timeoutId = setTimeout(() => reject(new Error(`La operación '${name}' tardó demasiado.`)), ms);
    });
    return Promise.race([ promise.then(res => { clearTimeout(timeoutId); return res; }), timeoutPromise ]);
  };

  try {
    const updateObject = {
      updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
      ...customData
    };
    if (settings) updateObject.settings = settings;
    if (umbrales) updateObject.umbrales = umbrales;

    await withTimeout(db.collection("users").doc(user.uid).set(updateObject, { merge: true }), 8000, 'saveConfigToCloud users update');
    console.log("☁️ Respaldado en Firebase Cloud.");
  } catch (error) {
    console.error("Error al guardar en Firebase:", error);
  }
};

function isIntercompanyTransfer(description) {
  if (!description) return false;
  const desc = description.toLowerCase();
  
  // 1. Detección de traspasos entre empresas hermanas (GMD y Grafhika)
  const isTransfer = desc.includes('traspaso') || desc.includes('transf') || desc.includes('transfe') || desc.includes('tef') || desc.includes('trasp');
  if (isTransfer) {
    const hasGmd = desc.includes('gmd') || desc.includes('grupo marketing digital') || desc.includes('grupo marketing') || desc.includes('gmd chile');
    const hasGrafhika = desc.includes('grafhika') || desc.includes('copy center') || desc.includes('copycenter');
    if (hasGmd || hasGrafhika) return true;
  }
  
  // 2. Detección de Rescates de Fondos Mutuos (movimientos internos de activos entre FFMM y Caja)
  const isRescate = desc.includes('rescate') && (desc.includes('fondo') || desc.includes('ffmm') || desc.includes('mutuo'));
  if (isRescate) return true;
  
  return false;
}

const fmt = (n, compact=false) => {
  if (n === undefined || n === null || isNaN(n)) return '$0';
  const cleanVal = Math.round(n);
  if (compact) {
    const a = Math.abs(cleanVal);
    if (a >= 1e6) return (cleanVal < 0 ? '-' : '') + '$' + (a / 1e6).toFixed(1).replace('.', ',') + ' MM';
    if (a >= 1e3) return (cleanVal < 0 ? '-' : '') + '$' + Math.round(a / 1e3) + ' K';
    return (cleanVal < 0 ? '-' : '') + '$' + a;
  }
  const parts = Math.abs(cleanVal).toString().split(".");
  parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ".");
  return (cleanVal < 0 ? '-' : '') + '$' + parts.join(".");
};
const fmtDate = s => { if(!s) return ''; const d=new Date(s+'T00:00:00'); return d.toLocaleDateString('es-CL',{day:'2-digit',month:'short',year:'numeric'}); };
const fmtMonth = s => { const [y,m]=s.split('-'); const names=['','Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic']; return `${names[+m]} ${y.slice(2)}`; };

// ── SVG Charts ─────────────────────────────────────────────────────────────
function AreaChart({data1,data2,labels,h=120,c1='var(--g600)',c2='var(--g300)'}) {
  const W=600,pad={t:8,r:4,b:22,l:44};
  const cw=W-pad.l-pad.r,ch=h-pad.t-pad.b;
  const all=[...data1,...(data2||[])];
  const mn=Math.min(...all)*0.92, mx=Math.max(...all)*1.05;
  const px=i=>pad.l+(i/(data1.length-1))*cw;
  const py=v=>pad.t+ch-((v-mn)/(mx-mn))*ch;
  const path=d=>d.map((v,i)=>`${i===0?'M':'L'}${px(i).toFixed(1)},${py(v).toFixed(1)}`).join(' ');
  const area=d=>`${path(d)} L${px(d.length-1)},${pad.t+ch} L${px(0)},${pad.t+ch} Z`;
  const ySteps=[mn,(mn+mx)/2,mx];
  return(
    <svg viewBox={`0 0 ${W} ${h}`} style={{width:'100%',height:h}} preserveAspectRatio="none">
      <defs>
        <linearGradient id="ag1" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor={c1} stopOpacity=".16"/><stop offset="100%" stopColor={c1} stopOpacity="0"/></linearGradient>
        <linearGradient id="ag2" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor={c2} stopOpacity=".22"/><stop offset="100%" stopColor={c2} stopOpacity="0"/></linearGradient>
      </defs>
      {[0,.5,1].map((f,i)=><line key={i} x1={pad.l} x2={W-pad.r} y1={pad.t+ch*f} y2={pad.t+ch*f} stroke="var(--border)" strokeWidth="1"/>)}
      {ySteps.map((v,i)=><text key={i} x={pad.l-5} y={pad.t+ch*(1-i/2)+4} textAnchor="end" fontSize="9" fill="var(--t3)" fontFamily="DM Mono">{fmt(v)}</text>)}
      {data2&&<path d={area(data2)} fill="url(#ag2)"/>}
      <path d={area(data1)} fill="url(#ag1)"/>
      {data2&&<path d={path(data2)} fill="none" stroke={c2} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>}
      <path d={path(data1)} fill="none" stroke={c1} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/>
      {labels.map((l,i)=>i%2===0&&<text key={i} x={px(i)} y={h-3} textAnchor="middle" fontSize="9" fill="var(--t3)" fontFamily="DM Mono">{l}</text>)}
    </svg>
  );
}

function BarChart({data,labels,h=110,colors}) {
  const W=600,pad={t:8,r:4,b:22,l:44};
  const cw=W-pad.l-pad.r,ch=h-pad.t-pad.b;
  const mx=Math.max(...data.map(Math.abs))*1.1;
  const bw=(cw/data.length)*0.55;
  return(
    <svg viewBox={`0 0 ${W} ${h}`} style={{width:'100%',height:h}} preserveAspectRatio="none">
      {[0,.5,1].map((f,i)=><line key={i} x1={pad.l} x2={W-pad.r} y1={pad.t+ch*f} y2={pad.t+ch*f} stroke="var(--border)" strokeWidth="1"/>)}
      <text x={pad.l-5} y={pad.t+4} textAnchor="end" fontSize="9" fill="var(--t3)" fontFamily="DM Mono">{fmt(mx)}</text>
      {data.map((v,i)=>{
        const bh=(Math.abs(v)/mx)*ch;
        const bx=pad.l+(i/data.length)*cw+(cw/data.length-bw)/2;
        const col=colors?colors[i]:(v>=0?'var(--g600)':'var(--red)');
        return(
          <g key={i}>
            <rect x={bx} y={pad.t+ch-bh} width={bw} height={bh} fill={col} rx="3" opacity=".9"/>
            <text x={bx+bw/2} y={h-3} textAnchor="middle" fontSize="9" fill="var(--t3)" fontFamily="DM Mono">{labels[i]}</text>
          </g>
        );
      })}
    </svg>
  );
}

function DonutChart({segments,size=100}) {
  const r=38,cx=size/2,cy=size/2;
  const total=segments.reduce((s,d)=>s+d.val,0);
  let angle=-Math.PI/2;
  const slices=segments.map(d=>{
    const a=(d.val/total)*2*Math.PI;
    const x1=cx+r*Math.cos(angle),y1=cy+r*Math.sin(angle);
    angle+=a;
    const x2=cx+r*Math.cos(angle),y2=cy+r*Math.sin(angle);
    return{...d,path:`M${cx},${cy} L${x1.toFixed(1)},${y1.toFixed(1)} A${r},${r},0,${a>Math.PI?1:0},1,${x2.toFixed(1)},${y2.toFixed(1)} Z`};
  });
  return(
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
      {slices.map((s,i)=><path key={i} d={s.path} fill={s.color} stroke="var(--surface)" strokeWidth="2"/>)}
      <circle cx={cx} cy={cy} r={26} fill="var(--surface)"/>
      <text x={cx} y={cy+2} textAnchor="middle" dominantBaseline="middle" fontSize="10" fontWeight="700" fontFamily="DM Sans" fill="var(--text)">{fmt(total)}</text>
    </svg>
  );
}

// ── Pages ─────────────────────────────────────────────────────────────────
// ── Movimientos Table with Filters ───────────────────────────────────────
function MovimientosTable({ 
  movRecientes, 
  saldos,
  manualAdjustments, 
  setManualAdjustments, 
  reconciliations, 
  setReconciliations, 
  logAuditEvent, 
  saveConfigToCloud,
  fbUser 
}) {
  const [busqueda, setBusqueda] = useState('');
  const [filtroBanco, setFiltroBanco] = useState('Todos');
  const [filtroTipo, setFiltroTipo] = useState('Todos');
  const [filtroFecha, setFiltroFecha] = useState('');
  const bancos = ['Todos', ...Object.keys(saldos || SALDOS_BANCO)];

  // Estados del Modal de Ajuste Provisorio
  const [showAddAdjModal, setShowAddAdjModal] = useState(false);
  const [newAdjDesc, setNewAdjDesc] = useState('');
  const [newAdjMonto, setNewAdjMonto] = useState('');
  const [newAdjTipo, setNewAdjTipo] = useState('INGRESO');
  const [newAdjBanco, setNewAdjBanco] = useState('BancoChile');
  const [newAdjFecha, setNewAdjFecha] = useState(() => new Date().toISOString().slice(0, 10));

  // Estados del Drawer de Bitácora / Conciliación
  const [selectedMov, setSelectedMov] = useState(null);
  const [commentInput, setCommentInput] = useState('');
  const [reconcileStatus, setReconcileStatus] = useState('Pendiente');

  // Helper de clave única para transacciones
  const getMovKey = (m) => {
    if (m.isProvisional) return m.id;
    return `${m.fecha}_${m.descripcion}_${m.monto}_${m.banco}`;
  };

  const handleAddAdjustment = async (e) => {
    e.preventDefault();
    if (!newAdjDesc || !newAdjMonto) {
      alert("⚠️ Por favor completa la descripción y el monto.");
      return;
    }
    const montoNum = Math.abs(parseInt(newAdjMonto.replace(/\./g, '')) || 0);
    const newAdj = {
      id: 'adj_' + Date.now(),
      fecha: newAdjFecha,
      descripcion: newAdjDesc,
      monto: newAdjTipo === 'INGRESO' ? montoNum : -montoNum,
      tipo: newAdjTipo,
      banco: newAdjBanco,
      isProvisional: true,
      creadoPor: fbUser ? (fbUser.displayName || fbUser.email) : 'Usuario Local',
      creadoEn: new Date().toISOString()
    };
    
    const updated = [newAdj, ...manualAdjustments];
    setManualAdjustments(updated);
    
    if (fbUser) {
      await saveConfigToCloud(null, null, { manualAdjustments: updated });
      await logAuditEvent(`Registró ajuste provisional: "${newAdjDesc}" por $${fmt(montoNum)} en ${newAdjBanco}`, 'ajuste');
    } else {
      localStorage.setItem('MANUAL_ADJUSTMENTS', JSON.stringify(updated));
    }
    
    setNewAdjDesc('');
    setNewAdjMonto('');
    setShowAddAdjModal(false);
    alert("✅ Movimiento provisional registrado y consolidado con éxito.");
  };

  const handleDeleteAdjustment = async (id, desc, monto) => {
    if (confirm(`¿Estás seguro de que deseas eliminar este movimiento provisional?\n\n"${desc}" por $${fmt(monto)}`)) {
      const updated = manualAdjustments.filter(adj => adj.id !== id);
      setManualAdjustments(updated);
      
      if (fbUser) {
        await saveConfigToCloud(null, null, { manualAdjustments: updated });
        await logAuditEvent(`Eliminó ajuste provisional: "${desc}" por $${fmt(monto)}`, 'ajuste');
      } else {
        localStorage.setItem('MANUAL_ADJUSTMENTS', JSON.stringify(updated));
      }
    }
  };

  const handleOpenCommentDrawer = (m) => {
    setSelectedMov(m);
    const existing = reconciliations[getMovKey(m)];
    if (existing) {
      setCommentInput(existing.observacion || '');
      setReconcileStatus(existing.estado || 'Pendiente');
    } else {
      setCommentInput('');
      setReconcileStatus('Pendiente');
    }
  };

  const handleSaveComment = async () => {
    if (!selectedMov) return;
    const key = getMovKey(selectedMov);
    const updatedRecs = { ...reconciliations };
    
    if (!commentInput && reconcileStatus === 'Pendiente') {
      delete updatedRecs[key];
    } else {
      updatedRecs[key] = {
        observacion: commentInput,
        estado: reconcileStatus,
        autor: fbUser ? (fbUser.displayName || fbUser.email) : 'Usuario Local',
        fecha: new Date().toISOString()
      };
    }
    
    setReconciliations(updatedRecs);
    
    if (fbUser) {
      await saveConfigToCloud(null, null, { reconciliations: updatedRecs });
      await logAuditEvent(`Actualizó conciliación de: "${selectedMov.descripcion}" a [${reconcileStatus}]`, 'conciliacion');
    } else {
      localStorage.setItem('RECONCILIATIONS', JSON.stringify(updatedRecs));
    }
    
    setSelectedMov(null);
    alert("✅ Observación / Conciliación guardada con éxito.");
  };

  // Obtener movRecientes desde las props (o el contexto) de forma reactiva
  const movRecientesList = movRecientes || MOV_RECIENTES;
  const filtrados = useMemo(() => {
    return movRecientesList.filter(m => {
      // Ignorar traspasos internos si se filtra por ingreso/gasto real
      if (m.isIntercompany && filtroTipo !== 'Todos') return false;
      
      if (filtroTipo !== 'Todos') {
        const signMatch = filtroTipo === 'INGRESO' ? m.monto > 0 : m.monto < 0;
        if (!signMatch) return false;
      }
      if (filtroBanco !== 'Todos' && m.banco !== filtroBanco) return false;
      if (filtroFecha && !m.fecha.startsWith(filtroFecha)) return false;
      if (busqueda && !m.descripcion.toLowerCase().includes(busqueda.toLowerCase())) return false;
      return true;
    }).sort((a,b) => b.fecha.localeCompare(a.fecha));
  }, [movRecientesList, busqueda, filtroBanco, filtroTipo, filtroFecha]);

  const inputStyle = {
    padding:'6px 10px', fontSize:12.5, border:'1px solid var(--border)',
    borderRadius:7, background:'var(--bg)', color:'var(--text)',
    fontFamily:'DM Sans', outline:'none', width:'100%',
  };
  const selStyle = {...inputStyle, cursor:'pointer'};

  const totalFiltrado = filtrados.reduce((s,m)=>s+m.monto, 0);

  return (
    <div className="card">
      <div className="card-hd">
        <div>
          <div className="card-title">Movimientos Recientes</div>
          <div className="card-sub">
            {filtrados.length} resultado{filtrados.length!==1?'s':''} · Total: <span style={{fontWeight:600,color:totalFiltrado>=0?'var(--g600)':'var(--red)'}}>{totalFiltrado>=0?'+':''}{fmt(totalFiltrado)}</span>
          </div>
        </div>
        
        <div style={{ display: 'flex', gap: 8 }}>
          <button 
            onClick={() => setShowAddAdjModal(true)}
            style={{
              background: 'linear-gradient(135deg, var(--primary) 0%, #3b82f6 100%)',
              color: '#fff', border: 'none', borderRadius: 7, padding: '6px 12px',
              fontSize: 12.5, fontWeight: 600, cursor: 'pointer', fontFamily: 'DM Sans',
              display: 'flex', alignItems: 'center', gap: 6, boxShadow: '0 3px 8px rgba(37,99,235,0.25)',
              transition: 'transform 0.2s'
            }}
            className="btn-hover-scale"
          >
            ➕ Ajuste Provisorio
          </button>
          <button className="card-act"><IC n="exp" s={12}/> Exportar</button>
        </div>
      </div>

      {/* Filtros */}
      <div style={{display:'grid',gridTemplateColumns:'1fr 140px 130px 120px',gap:8,marginBottom:14}}>
        <div style={{position:'relative'}}>
          <svg width={14} height={14} viewBox="0 0 24 24" fill="none" stroke="var(--t3)" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" style={{position:'absolute',left:9,top:'50%',transform:'translateY(-50%)'}}>
            <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
          </svg>
          <input style={{...inputStyle,paddingLeft:28}} placeholder="Buscar descripción..." value={busqueda} onChange={e=>setBusqueda(e.target.value)}/>
        </div>
        <select style={selStyle} value={filtroBanco} onChange={e=>setFiltroBanco(e.target.value)}>
          {bancos.map(b=><option key={b}>{b}</option>)}
        </select>
        <select style={selStyle} value={filtroTipo} onChange={e=>setFiltroTipo(e.target.value)}>
          {['Todos','INGRESO','GASTO'].map(t=><option key={t}>{t}</option>)}
        </select>
        <input type="date" style={selStyle} value={filtroFecha} onChange={e=>setFiltroFecha(e.target.value)} title="Filtrar por fecha"/>
      </div>

      {/* Botón limpiar */}
      {(busqueda||filtroBanco!=='Todos'||filtroTipo!=='Todos'||filtroFecha) && (
        <button onClick={()=>{setBusqueda('');setFiltroBanco('Todos');setFiltroTipo('Todos');setFiltroFecha('');}}
          style={{marginBottom:12,fontSize:13,color:'var(--g600)',background:'var(--g50)',border:'1px solid var(--g200)',borderRadius:6,padding:'4px 10px',cursor:'pointer',fontFamily:'DM Sans',fontWeight:500}}>
          ✕ Limpiar filtros
        </button>
      )}

      <table className="tbl">
        <thead>
          <tr>
            <th>Fecha</th>
            <th>Descripción</th>
            <th>Banco</th>
            <th>Tipo</th>
            <th className="r">Monto</th>
            <th style={{ width: 80, textAlign: 'center' }}>Acciones</th>
          </tr>
        </thead>
        <tbody>
          {filtrados.length === 0
            ? <tr><td colSpan={6} style={{textAlign:'center',color:'var(--t3)',padding:'24px 0',fontStyle:'italic'}}>Sin resultados para los filtros aplicados</td></tr>
            : filtrados.slice(0, 50).map((m,i)=>{
                const desc = (m.descripcion || '').toLowerCase();
                const isRescate = desc.includes('rescate') && (desc.includes('fondo') || desc.includes('ffmm') || desc.includes('mutuo'));
                const recVal = reconciliations[getMovKey(m)];
                return (
                  <tr key={i} style={{opacity: m.isIntercompany ? 0.75 : 1, background: m.isProvisional ? 'rgba(37,99,235,0.03)' : 'inherit'}}>
                    <td className="mono" style={{color:'var(--t3)',fontSize:13}}>{fmtDate(m.fecha)}</td>
                    <td style={{fontWeight:500,maxWidth:280}}>
                      <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
                        {m.isProvisional && (
                          <span style={{ 
                            background: '#eff6ff', color: 'var(--primary)', border: '1px solid rgba(37,99,235,0.15)',
                            padding: '1px 6px', borderRadius: 4, fontSize: 9.5, fontWeight: 700
                          }}>
                            PROVISIONAL
                          </span>
                        )}
                        <span style={{ overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }} title={m.descripcion}>
                          {m.descripcion}
                        </span>
                      </div>
                      {recVal && (
                        <div style={{
                          fontSize: 11, color: recVal.estado === 'Conciliado' ? '#059669' : recVal.estado === 'Revisado' ? '#d97706' : 'var(--text-secondary)',
                          fontStyle: 'italic', marginTop: 3, display: 'flex', alignItems: 'center', gap: 4
                        }}>
                          <span>📝</span>
                          <span style={{maxWidth: 240, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap'}} title={recVal.observacion}>
                            {recVal.estado === 'Conciliado' ? '[Conciliado] ' : recVal.estado === 'Revisado' ? '[Revisado] ' : ''}
                            {recVal.observacion}
                          </span>
                          <span style={{fontSize: 9.5, color: 'var(--t3)'}}>· {recVal.autor}</span>
                        </div>
                      )}
                    </td>
                    <td style={{color:'var(--t3)',fontSize:12}}>{m.banco}</td>
                    <td>
                      {m.isIntercompany ? (
                        <span className="pill gr" style={{background:'#f1f5f9',color:'#475569',border:'1px solid #cbd5e1'}}>
                          {isRescate ? 'RESCATE FFMM' : 'TRASPASO INTERNO'}
                        </span>
                      ) : (
                        <span className={`pill ${m.monto>0?'g':'r'}`}>{m.monto>0?'INGRESO':'GASTO'}</span>
                      )}
                    </td>
                    <td className="mono r" style={{fontWeight:600,color:m.isIntercompany?'var(--t3)':(m.monto>0?'var(--g600)':'var(--red)')}}>
                      {m.monto>0?'+':''}{fmt(m.monto)}
                    </td>
                    <td>
                      <div style={{ display: 'flex', gap: 6, justifyContent: 'center', alignItems: 'center' }}>
                        <button 
                          onClick={() => handleOpenCommentDrawer(m)}
                          title="Observación / Conciliar"
                          style={{
                            background: 'none', border: 'none', cursor: 'pointer', fontSize: 14,
                            padding: '4px', display: 'flex', alignItems: 'center', borderRadius: 4,
                            position: 'relative'
                          }}
                          className="btn-hover-scale"
                        >
                          💬
                          {recVal && (
                            <span style={{
                              width: 6, height: 6, background: recVal.estado === 'Conciliado' ? '#059669' : recVal.estado === 'Revisado' ? '#d97706' : '#94a3b8',
                              borderRadius: '50%', position: 'absolute', top: 2, right: 0
                            }} />
                          )}
                        </button>
                        {m.isProvisional && (
                          <button 
                            onClick={() => handleDeleteAdjustment(m.id, m.descripcion, m.monto)}
                            title="Eliminar movimiento provisorio"
                            style={{
                              background: 'none', border: 'none', cursor: 'pointer', fontSize: 13,
                              padding: '4px', display: 'flex', alignItems: 'center', borderRadius: 4, color: 'var(--red)'
                            }}
                            className="btn-hover-scale"
                          >
                            🗑️
                          </button>
                        )}
                      </div>
                    </td>
                  </tr>
                );
              })
          }
          {filtrados.length > 50 && (
            <tr>
              <td colSpan={6} style={{textAlign:'center', color:'var(--t3)', padding:'12px', fontSize:13, background:'var(--bg)'}}>
                Mostrando los primeros 50 movimientos de {filtrados.length}. Usa los filtros para refinar tu búsqueda.
              </td>
            </tr>
          )}
        </tbody>
      </table>

      {/* Modal Agregar Ajuste Provisorio */}
      {showAddAdjModal && (
        <div style={{
          position:'fixed', top:0, left:0, width:'100vw', height:'100vh',
          background:'rgba(15,23,42,0.4)', backdropFilter:'blur(5px)',
          display:'flex', alignItems:'center', justifyContent:'center', zIndex:1000,
          animation:'fadeIn 0.2s'
        }}>

function GastosFijosCard({ fbUser }) {
  const { useState, useEffect, useMemo } = React;
  const hoyGF = new Date();
  const meses3GF = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  const totalFijo = GASTOS_FIJOS_DATA.reduce((s,g)=>s+g.monto,0);
  
  const currentMonthStr = `${hoyGF.getFullYear()}-${String(hoyGF.getMonth() + 1).padStart(2, '0')}`;
  
  const getTodayStr = () => {
    const y = hoyGF.getFullYear();
    const m = String(hoyGF.getMonth() + 1).padStart(2, '0');
    const d = String(hoyGF.getDate()).padStart(2, '0');
    return `${y}-${m}-${d}`;
  };

  const [completedTasks, setCompletedTasks] = useState({});
  const [showPaymentModal, setShowPaymentModal] = useState(null);
  const [paymentDate, setPaymentDate] = useState(getTodayStr());
  const [payerName, setPayerName] = useState(fbUser ? fbUser.email : '');

  useEffect(() => {
    if (!db) {
      // Modo sin conexión: Cargar desde localStorage
      try {
        const saved = localStorage.getItem(`offline_tasks_${currentMonthStr}`);
        if (saved) setCompletedTasks(JSON.parse(saved));
      } catch (e) {}
      return;
    }
    const unsubscribe = db.collection('completed_tasks')
      .where('mes', '==', currentMonthStr)
      .onSnapshot((snapshot) => {
        const dict = {};
        snapshot.forEach(doc => { 
          const d = doc.data();
          dict[d.taskId] = { 
            completed: true, 
            fechaPago: d.fechaPago, 
            quienPago: d.completedBy 
          }; 
        });
        setCompletedTasks(dict);
      }, (err) => console.error("Error fetching completed tasks:", err));
    return unsubscribe;
  }, [currentMonthStr, db]);

  const toggleTask = async (task, isCompleted, extraData = {}) => {
    // Actualización optimista
    setCompletedTasks(prev => {
      const next = { ...prev };
      if (isCompleted) delete next[task.taskIdStr];
      else next[task.taskIdStr] = { 
        completed: true, 
        fechaPago: extraData.fechaPago || getTodayStr(), 
        quienPago: extraData.quienPago || (fbUser ? fbUser.email : 'Local') 
      };
      
      // Guardar también en localStorage como respaldo (modo sin conexión)
      localStorage.setItem(`offline_tasks_${currentMonthStr}`, JSON.stringify(next));
      return next;
    });

    // Si no hay conexión a Firebase, terminamos aquí (se usará localStorage)
    if (!db || !fbUser) {
      return;
    }

    try {
      if (isCompleted) {
        const snapshot = await db.collection('completed_tasks')
          .where('taskId', '==', task.taskIdStr)
          .get();
        const deletePromises = [];
        snapshot.forEach(doc => deletePromises.push(doc.ref.delete()));
        await Promise.all(deletePromises);
      } else {
        await db.collection('completed_tasks').add({
          taskId: task.taskIdStr,
          mes: currentMonthStr,
          descripcion: task.descripcion,
          completedBy: extraData.quienPago || fbUser.email,
          fechaPago: extraData.fechaPago || getTodayStr(),
          completedAt: firebase.firestore.FieldValue.serverTimestamp()
        });
      }
    } catch (e) {
      console.error("Error toggling task:", e);
      alert("Detalle del error: " + e.message);
      // Revertir en caso de error
      setCompletedTasks(prev => {
        const next = { ...prev };
        if (isCompleted) next[task.taskIdStr] = { completed: true }; // simplification for rollback
        else delete next[task.taskIdStr];
        return next;
      });
    }
  };

  const confirmPayment = async () => {
    const task = showPaymentModal;
    if (!task) return;
    setShowPaymentModal(null);
    await toggleTask(task, false, { fechaPago: paymentDate, quienPago: payerName });
  };

  const handleSyncToCalendar = (task) => {
    const year = hoyGF.getFullYear();
    const month = hoyGF.getMonth();
    const formatLocalDate = (date) => {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, '0');
      const d = String(date.getDate()).padStart(2, '0');
      return `${y}${m}${d}`;
    };
    const eventDate = new Date(year, month, task.dia_pago);
    const startStr = formatLocalDate(eventDate);
    const nextDate = new Date(year, month, task.dia_pago + 1);
    const endStr = formatLocalDate(nextDate);

    const title = encodeURIComponent(`Pago: ${task.descripcion}`);
    const details = encodeURIComponent(`Pago recurrente de Gasto Fijo.\nMonto: $${task.monto.toLocaleString('es-CL')}\nCategoría: ${task.categoria||'Otros'}\n\nCreado automáticamente desde el Dashboard Financiero.`);
    const url = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${title}&dates=${startStr}/${endStr}&details=${details}`;
    
    window.open(url, '_blank');
  };

  const conFecha = useMemo(() => {
    return GASTOS_FIJOS_DATA.map(g => {
      const yr=hoyGF.getFullYear(), mo=hoyGF.getMonth();
      let p = new Date(yr,mo,g.dia_pago||30);
      if(p < hoyGF) p = new Date(yr,mo+1,g.dia_pago||30);
      const dias = Math.round((p-hoyGF)/86400000);
      
      const taskIdStr = `${g.descripcion.replace(/[^a-zA-Z0-9]/g, '_')}-${currentMonthStr}`;
      const isCompleted = !!completedTasks[taskIdStr];
      const details = completedTasks[taskIdStr] || null;
      
      return {...g, proxFecha:p, dias, taskIdStr, isCompleted, details};
    }).sort((a,b) => {
      if (a.isCompleted !== b.isCompleted) return a.isCompleted ? 1 : -1;
      return a.dias - b.dias;
    });
  }, [completedTasks, currentMonthStr]);

  // Categorías únicas para resumen
  const porCategoria = {};
  GASTOS_FIJOS_DATA.forEach(g=>{
    const cat = g.categoria||'Otros';
    if(!porCategoria[cat]) porCategoria[cat]={cat,monto:0,count:0};
    porCategoria[cat].monto+=g.monto; porCategoria[cat].count++;
  });
  const cats = Object.values(porCategoria).sort((a,b)=>b.monto-a.monto);

  const urgBg  = d => d<=0?'rgba(220,38,38,.07)':d<=2?'rgba(251,146,60,.06)':d<=7?'rgba(234,179,8,.05)':'transparent';
  const urgCol = d => d<=0?'var(--red)':d<=2?'oklch(45% .17 75)':d<=7?'oklch(52% .15 75)':'var(--t3)';
  const urgTag = d => d<0?<span style={{fontSize:11,fontWeight:700,color:'var(--red)',background:'var(--red-bg)',padding:'1px 6px',borderRadius:4}}>🔴 Vencido</span>
    :d===0?<span style={{fontSize:11,fontWeight:700,color:'var(--red)',background:'var(--red-bg)',padding:'1px 6px',borderRadius:4}}>🔴 Hoy</span>
    :d<=2?<span style={{fontSize:11,fontWeight:700,color:'oklch(45% .17 75)',background:'var(--amber-bg)',padding:'1px 6px',borderRadius:4}}>🟠 ${d}d</span>
    :d<=7?<span style={{fontSize:11,fontWeight:600,color:'oklch(52% .15 75)',background:'oklch(98% .04 90)',padding:'1px 6px',borderRadius:4}}>🟡 ${d}d</span>
    :null;

  const totalPagado = conFecha.filter(t => t.isCompleted).reduce((s, t) => s + t.monto, 0);
  const percent = totalFijo ? Math.round((totalPagado / totalFijo) * 100) : 0;

  if (!GASTOS_FIJOS_DATA.length) {
    return (
      <div className="card mb" style={{border:'1.5px dashed var(--border)'}}>
        <div className="card-hd" style={{marginBottom:0}}>
          <div style={{display:'flex',alignItems:'center',gap:10}}>
            <div style={{width:34,height:34,background:'var(--amber-bg)',borderRadius:10,display:'flex',alignItems:'center',justifyContent:'center',fontSize:18}}>📌</div>
            <div>
              <div className="card-title">Gastos Fijos</div>
              <div className="card-sub">Sin datos cargados</div>
            </div>
          </div>
        </div>
        <div style={{padding:'16px 0 4px',display:'flex',gap:16,alignItems:'flex-start',flexWrap:'wrap'}}>
          <div style={{fontSize:13,color:'var(--t2)',lineHeight:1.7,flex:1,minWidth:220}}>
            Los gastos fijos se cargan desde la pestaña <b>GASTOS_FIJOS</b> del Google Sheets.<br/>
            <span style={{fontSize:12,color:'var(--t3)'}}>Columnas requeridas: descripcion · monto · dia_pago · categoria</span>
          </div>
          <div style={{fontSize:12,color:'var(--t3)',background:'var(--bg)',borderRadius:8,padding:'8px 12px',lineHeight:1.8,minWidth:180}}>
            1. Abre Google Sheets → pestaña <b>GASTOS_FIJOS</b><br/>
            2. Agrega cada gasto recurrente<br/>
            3. Recarga el dashboard
          </div>
        </div>
      </div>
    );
  }

  return (

// ── Tareas Inteligentes Page Component ──
function GastosPage({ nominaVer, fbUser }) {
  const pendientes = GASTOS.filter(g=>g.estado==='Pendiente').sort((a,b)=>a.fecha.localeCompare(b.fecha));
  const pagados = GASTOS.filter(g=>g.estado==='Pagado').sort((a,b)=>a.fecha.localeCompare(b.fecha));
  const totalPend = pendientes.reduce((s,g)=>s+g.monto,0);
  const totalPag = pagados.reduce((s,g)=>s+g.monto,0);
  const [tab,setTab] = useState('pendiente');

  // By month
  const meses = {'2026-03':{pagado:0,pendiente:0},'2026-04':{pagado:0,pendiente:0},'2026-05':{pagado:0,pendiente:0}};
  GASTOS.forEach(g=>{const m=g.fecha.slice(0,7);if(meses[m]){meses[m][g.estado==='Pagado'?'pagado':'pendiente']+=g.monto;}});

  const totalNomina = NOMINA_DATA.reduce((s,e)=>s+e.monto,0);

  return (
    <div className="page">
      {/* ── KPIs ─────────────────────────────────────────────────────── */}
      <div className="kpi-grid">
        {[
          {label:'Total Proyectado',  val:fmt(totalPend+totalPag), sub:'Mar–May 2026',  dir:'g'},
          {label:'Pagado',            val:fmt(totalPag),           sub:`${pagados.length} pagos`,  dir:'g'},
          {label:'Pendiente',         val:fmt(totalPend),          sub:`${pendientes.length} pagos`, dir:'a'},
          {label:'Próx. Vencimiento', val:fmt(pendientes[0]?.monto||0), sub:fmtDate(pendientes[0]?.fecha||''), dir:'r'},
          ...(totalNomina>0?[{label:'Nómina del Mes', val:fmt(totalNomina), sub:`${NOMINA_DATA.reduce((s,e)=>s+(e.personas||1),0)} personas`, dir:'b'}]:[]),
          ...(ANTICIPOS_DATA.length>0?[{label:'Anticipos del Mes', val:fmt(ANTICIPOS_DATA.reduce((s,e)=>s+e.monto,0)), sub:`${ANTICIPOS_DATA.reduce((s,e)=>s+(e.personas||1),0)} personas`, dir:'a'}]:[]),
          ...(GASTOS_FIJOS_DATA.length>0?[{label:'Gastos Fijos', val:fmt(GASTOS_FIJOS_DATA.reduce((s,g)=>s+g.monto,0)), sub:`${GASTOS_FIJOS_DATA.length} ítems recurrentes`, dir:'a'}]:[]),
        ].map((k,i)=>(
          <div className="kcard" key={i}><div className="kcard-label">{k.label}</div><div className="kcard-val">{k.val}</div><div className={`kcard-change ${k.dir}`}><span className="sub">{k.sub}</span></div></div>
        ))}
      </div>

      {/* ── NÓMINA — sección siempre visible ─────────────────────────── */}
      <NominaSectionCard nominaVer={nominaVer}/>

      {/* ── ANTICIPOS — segunda tabla de la hoja SUELDOS ─────────────── */}
      <AnticiposSectionCard/>

      {/* ── GASTOS FIJOS — sección siempre visible ───────────────────── */}
      <GastosFijosCard fbUser={fbUser}/>

      {/* ── Gráficos ─────────────────────────────────────────────────── */}
      <div className="g11 mb">
        <div className="card">
          <div className="card-hd"><div className="card-title">Gastos por Mes</div></div>
          <BarChart data={Object.values(meses).map(m=>m.pagado+m.pendiente)} labels={Object.keys(meses).map(fmtMonth)} h={100} colors={['var(--g600)','var(--amber)','var(--g300)']}/>
          <div style={{display:'flex',gap:12,marginTop:10}}>
            {Object.entries(meses).map(([m,v],i)=>(

                const esHoy      = dias === 0;
                const es2dias    = dias >= 1 && dias <= 2;
                const es7dias    = dias >= 3 && dias <= 7;
                const rowBg = tab==='pendiente'
                  ? esVencido||esHoy ? 'rgba(220,38,38,.07)'
                  : es2dias          ? 'rgba(251,146,60,.07)'
                  : es7dias          ? 'rgba(234,179,8,.06)'
                  : 'transparent'
                  : 'transparent';
                const alerta = tab!=='pendiente' ? null
                  : esVencido  ? <span style={{display:'inline-flex',alignItems:'center',gap:4,fontSize:11.5,fontWeight:700,color:'var(--red)',background:'var(--red-bg)',padding:'2px 7px',borderRadius:5}}>🔴 Vencido</span>

                  : es7dias    ? <span style={{display:'inline-flex',alignItems:'center',gap:4,fontSize:11.5,fontWeight:600,color:'oklch(52% .15 75)',background:'oklch(98% .04 90)',padding:'2px 7px',borderRadius:5}}>🟡 {dias}d</span>
                  : null;
                return (
                  <tr key={i} style={{background:rowBg}}>
                    <td className="mono" style={{color: tab==='pendiente'&&(esVencido||esHoy)?'var(--red)':es2dias?'oklch(45% .17 75)':'var(--t3)',fontSize:13,fontWeight:esVencido||esHoy?700:400}}>{fmtDate(g.fecha)}</td>
                    <td style={{fontWeight:500}}>{g.descripcion}</td>
                    <td className="mono r" style={{fontWeight:600}}>{fmt(g.monto)}</td>
                    <td><span className={`pill ${g.estado==='Pagado'?'g':'a'}`}>{g.estado}</span></td>
                    <td>{alerta}</td>
                  </tr>
                );
              })}
              {(tab==='pendiente'?pendientes:pagados).length > 100 && (
                <tr>
                  <td colSpan={5} style={{textAlign:'center', color:'var(--t3)', padding:'12px', fontSize:13, background:'var(--bg)'}}>
                    Mostrando los primeros 100 gastos de {(tab==='pendiente'?pendientes:pagados).length}.
                  </td>
                </tr>
              )}
            </tbody>
          </table>
        
      </div>
    </div>
  );
}

function VentasPage({ onUpload, dataLoaded }) {
  const [tab, setTab] = useState('resumen');

  const [filtroEstado, setFiltroEstado] = useState('Todos');

  if (!COB_KPIS) return <VentasSinDatos onUpload={onUpload} dataLoaded={dataLoaded}/>;

  const meses = Object.keys(COB_POR_MES);
  const fmtM = m => { const [y,mo]=m.split('-'); const n=['','Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic']; return `${n[+mo]} ${y.slice(2)}`; };

  // KPIs
  const { totalFacturado, totalSaldo, totalPagado, totalFactoring, countDocs,
          countVencido, saldoVencido, countPendiente, saldoPendiente } = COB_KPIS;
  const pctCobrado = ((totalPagado / totalFacturado) * 100).toFixed(1);

  // Pendientes filtrados (MEMOIZADO): antes este filtro+ordenamiento corría en CADA render
  // (cada clic en la página). Ahora solo recalcula al cambiar búsqueda/filtro o al cargar
  // nuevos datos de cobranza → la página responde mucho más fluida.
  const hayBusqueda = busqueda.trim().length > 0;
  const pendientesFiltrados = useMemo(() => {
    const sortFecha = (a,b) => (b.fechaPago||b.fechaEmision||'').localeCompare(a.fechaPago||a.fechaEmision||'');
    const todos = COB_PENDIENTES.filter(r => {
      if (filtroEstado !== 'Todos' && r.estado !== filtroEstado) return false;
      if (hayBusqueda) {
        const q = busqueda.toLowerCase();
        const match = r.empresa.toLowerCase().includes(q) ||
                      String(r.folio).includes(busqueda) ||
                      (r.folioStr||'').toLowerCase().includes(q) ||
                      (r.rut||'').includes(busqueda);
        if (!match) return false;
      }
      return true;
    });
    // Si hay búsqueda activa → mostrar todo sin límite
    if (hayBusqueda || filtroEstado !== 'Todos') return todos.sort(sortFecha);
    // Sin búsqueda → activos completos + últimos 50 por cada estado cerrado
    const activos   = todos.filter(r => r.estado==='PENDIENTE' || r.estado==='VENCIDO');
    const pagados   = todos.filter(r => r.estado==='PAGADO' || (r.saldo===0 && r.estado!=='FACTORING')).sort(sortFecha).slice(0,50);
    const factoring = todos.filter(r => r.estado==='FACTORING').sort(sortFecha).slice(0,50);
    const otros     = todos.filter(r => !['PENDIENTE','VENCIDO','PAGADO','FACTORING'].includes(r.estado)).sort(sortFecha).slice(0,50);

  // Vencidos críticos (memoizado: depende solo de los datos de cobranza)

      <div className="tabs">

function FondosLineChart({ data }) {
  if(!data||data.length<2) return null;
  const W=700, H=200, pad={t:16,r:24,b:32,l:62};
  const cw=W-pad.l-pad.r, ch=H-pad.t-pad.b;
  const totals=data.map(function(item){return item.total;});
  const minV=Math.min.apply(null,totals), maxV=Math.max.apply(null,totals);
  const rng=maxV-minV||1;
  function getY(v){return pad.t+ch-((v-minV)/rng)*ch;}
  function getX(idx){return pad.l+(idx/(data.length-1))*cw;}

  // Build smooth bezier path — using explicit variable names (no 'd')
  const pts=data.map(function(item,idx){return{x:getX(idx),y:getY(item.total)};});
  var linePth='', areaPth='';
  var pathStr='M'+pts[0].x.toFixed(1)+','+pts[0].y.toFixed(1);
  for(var pi=1;pi<pts.length;pi++){
    var cx2=(pts[pi-1].x+pts[pi].x)/2;
    pathStr+=' Q'+cx2.toFixed(1)+','+pts[pi-1].y.toFixed(1)+','+pts[pi].x.toFixed(1)+','+pts[pi].y.toFixed(1);
  }
  linePth=pathStr;
  areaPth=pathStr+' L'+pts[pts.length-1].x.toFixed(1)+','+(pad.t+ch)+' L'+pts[0].x.toFixed(1)+','+(pad.t+ch)+' Z';

  // Y-axis compact labels
  function fmtCompact(v){var a=Math.abs(v);if(a>=1e9)return'$'+(v/1e9).toFixed(1)+'B';if(a>=1e6)return'$'+(v/1e6).toFixed(0)+'M';if(a>=1e3)return'$'+Math.round(v/1e3)+'K';return'$'+v;}
  var yTicks=4;
  var yGrid=[];for(var yi=0;yi<=yTicks;yi++)yGrid.push(minV+(rng/yTicks)*yi);

  // X-axis labels
  var xStep=Math.max(1,Math.round(data.length/7));
  var MESES=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  function fmtFecha(s){var parts=s.split('-');return parts[2]+' '+MESES[parseInt(parts[1],10)-1];}

  var lastPt=pts[pts.length-1];
  var lastTotal=totals[totals.length-1];

  return(
    <svg viewBox={'0 0 '+W+' '+H} style={{width:'100%',height:'auto',display:'block'}} preserveAspectRatio="xMidYMid meet">
      <defs>
        <linearGradient id="fondGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor="var(--g500)" stopOpacity=".22"/>
          <stop offset="75%" stopColor="var(--g500)" stopOpacity=".04"/>
          <stop offset="100%" stopColor="var(--g500)" stopOpacity="0"/>
        </linearGradient>
      </defs>

      {/* Gridlines + Y labels */}
      {yGrid.map(function(v,gi){
        var yy=getY(v);
        return(
          <g key={gi}>
            <line x1={pad.l} x2={W-pad.r} y1={yy} y2={yy} stroke="var(--border)" strokeWidth={gi===0?1:.7} strokeDasharray={gi===0?undefined:'4 3'} opacity={gi===0?1:.65}/>
            <text x={pad.l-6} y={yy+4} textAnchor="end" fontSize="10" fill="var(--t3)" fontFamily="DM Mono,monospace">{fmtCompact(v)}</text>
          </g>
        );
      })}

      {/* Area fill */}
      <path d={areaPth} fill="url(#fondGrad)"/>

      {/* Line */}
      <path d={linePth} fill="none" stroke="var(--g500)" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/>

      {/* X axis labels */}
      {data.map(function(item,idx){
        if(idx%xStep!==0) return null;
        return <text key={idx} x={getX(idx)} y={H-5} textAnchor="middle" fontSize="9.5" fill="var(--t3)" fontFamily="DM Mono,monospace">{fmtFecha(item.fecha)}</text>;
      })}

      {/* Last point dot + tooltip */}
      <circle cx={lastPt.x} cy={lastPt.y} r="5" fill="var(--g600)" stroke="var(--surface)" strokeWidth="2.5"/>
      <rect x={lastPt.x-40} y={lastPt.y-26} width={80} height={18} rx="5" fill="var(--g700)" opacity=".9"/>
      <text x={lastPt.x} y={lastPt.y-13} textAnchor="middle" fontSize="9.5" fill="#fff" fontFamily="DM Mono,monospace" fontWeight="700">{fmtCompact(lastTotal)}</text>
    </svg>
  );
}

function FondosPage() {

  if(!FONDOS||FONDOS.length<1){
    return (
      <div className="page" style={{display:'flex',alignItems:'center',justifyContent:'center',minHeight:'60vh'}}>
        <div style={{textAlign:'center'}}>
          <div style={{width:32,height:32,border:'3px solid var(--g200)',borderTopColor:'var(--g600)',borderRadius:'50%',animation:'spin 0.7s linear infinite',margin:'0 auto 14px'}}/>

        </div>
      </div>
    );
  }

  var fondosN = FONDOS.length;
  const actual   = FONDOS[fondosN-1].total;
  const prevSem  = fondosN>=2 ? FONDOS[fondosN-2].total : actual;
  const prevMes  = fondosN>=5 ? FONDOS[fondosN-5].total : actual;
  const inicio   = FONDOS[0].total;

  const varSem   = actual - prevSem;
  const varMes   = actual - prevMes;
  const varTotal = actual - inicio;
  const pctSem   = prevSem ? ((actual/prevSem-1)*100) : 0;
  const pctMes   = prevMes ? ((actual/prevMes-1)*100) : 0;
  const pctTotal = inicio  ? ((actual/inicio-1)*100)  : 0;
  const sgn = v => v>=0?'+':'';

  const totalFondos = FONDOS_DETALLE.reduce((s,f)=>s+f.valor,0);

  return (
    <div className="page">

      {/* ── KPIs ─────────────────────────────────────────────────────── */}
      <div className="kpi-grid">
        {[
          {label:'Patrimonio Total',  val:fmt(actual),   sub:`Al ${fmtDate(FONDOS[FONDOS.length-1].fecha)}`, dir:'g'},
          {label:'Variación Semanal', val:(varSem>=0?'+':'-')+fmt(Math.abs(varSem)), sub:`${sgn(pctSem)}${pctSem.toFixed(2)}% esta semana`,  dir:'g'},
          {label:'Variación Mensual', val:(varMes>=0?'+':'-')+fmt(Math.abs(varMes)), sub:`${sgn(pctMes)}${pctMes.toFixed(1)}% este mes`,     dir: varMes>=0?'g':'a'},
          {label:'Desde Inicio',      val:fmt(varTotal), sub:`${sgn(pctTotal)}${pctTotal.toFixed(1)}% total`,     dir:'b'},
        ].map((k,i)=>(
          <div className="kcard" key={i}>
            <div className={`kcard-icon ${k.dir}`}><IC n="fon" s={15}/></div>
            <div className="kcard-label">{k.label}</div>
            <div className="kcard-val lg">{k.val}</div>
            <div className={`kcard-change ${k.dir}`}><span className="sub">{k.sub}</span></div>
          </div>
        ))}
      </div>

      {/* ── Gráfico evolución ────────────────────────────────────────── */}
      <div className="card mb">
        <div className="card-hd">
          <div>
            <div className="card-title">Evolución del Patrimonio</div>
            <div className="card-sub">{fmtDate(FONDOS[0].fecha)} — {fmtDate(FONDOS[FONDOS.length-1].fecha)}</div>
          </div>
          <div style={{textAlign:'right'}}>
            <div style={{fontFamily:'DM Sans',fontWeight:800,fontSize:20,color:'var(--g700)'}}>{fmt(actual,true)}</div>
            <div style={{fontSize:12,color: varTotal>=0?'var(--g600)':'var(--red)',fontWeight:600}}>{sgn(pctTotal)}{pctTotal.toFixed(1)}% desde inicio</div>
          </div>
        </div>
        <div style={{marginTop:12}}>
          <FondosLineChart data={FONDOS}/>

      {/* ── Distribución + Tabla ─────────────────────────────────────── */}

            <DonutChart segments={FONDOS_DETALLE.map(f=>({val:f.valor,color:f.color}))} size={110}/>

                return(
                  <div key={i} style={{marginBottom:10}}>
                    <div className="dl-row" style={{marginBottom:3}}>
                      <div className="dl-name"><div style={{width:8,height:8,borderRadius:'50%',background:f.color,minWidth:8}}/><span style={{fontWeight:600}}>{f.nombre}</span></div>

                    </div>
                    <div style={{marginLeft:18,display:'flex',alignItems:'center',gap:8}}>
                      <div style={{flex:1,height:4,borderRadius:99,background:'var(--border)',overflow:'hidden'}}>
                        <div style={{width:`${pct}%`,height:'100%',background:f.color,borderRadius:99}}/>
                      </div>
                      <span style={{fontSize:11.5,color:'var(--t3)',minWidth:30,textAlign:'right'}}>{pct}%</span>
                    </div>
                  </div>
                );
              })}
              <div style={{marginTop:10,paddingTop:10,borderTop:'1px solid var(--border)',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                <span style={{fontSize:12,color:'var(--t3)',fontWeight:600}}>Total</span>
                <span style={{fontFamily:'DM Sans',fontWeight:800,fontSize:14,color:'var(--g700)'}}>{fmt(totalFondos)}</span>
              </div>
            </div>

        <div className="card">
          <div className="card-hd"><div className="card-title">Últimas Semanas</div></div>
          <table className="tbl">
            <thead><tr>
              <th>Fecha</th>
              <th className="r">Patrimonio</th>
              <th className="r">Variación</th>
              <th className="r">%</th>
            </tr></thead>
            <tbody>
              {FONDOS.slice(-10).reverse().map((f,i,arr)=>{
                const prev=arr[i+1];
                const diff=prev?f.total-prev.total:0;
                const pct=prev&&prev.total>0?((diff/prev.total)*100):0;
                const pos=diff>=0;
                return(
                  <tr key={i}>
                    <td className="mono" style={{color:'var(--t3)',fontSize:12.5}}>{fmtDate(f.fecha)}</td>
                    <td className="mono r" style={{fontWeight:i===0?700:500,color:i===0?'var(--g700)':'var(--text)'}}>{fmt(f.total)}</td>
                    <td className="mono r" style={{fontSize:13,color:i===0?'var(--t3)':pos?'var(--g600)':'var(--red)',fontWeight:600}}>
                      {i===arr.length-1?'—':(pos?'+':'')+fmt(diff)}
                    </td>
                    <td className="r" style={{fontSize:12.5}}>
                      {i===arr.length-1?<span style={{color:'var(--t3)'}}>—</span>:<span style={{color:pos?'var(--g600)':'var(--red)',fontWeight:600}}>{pos?'+':''}{pct.toFixed(2)}%</span>}
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

function FiniquitosPage() {
  const [expandido, setExpandido] = React.useState({});

  // Agrupar filas por nombre
  var grupos = {};
  FINIQUITOS_RAW.forEach(function(r) {
    if (!r.nombre) return;
    if (!grupos[r.nombre]) grupos[r.nombre] = { nombre: r.nombre, tipo: r.tipo, montoTotal: r.montoTotal, cuotas: [] };
    grupos[r.nombre].cuotas.push(r);
  });
  var items = Object.values(grupos).map(function(item) {
    var pagado = item.cuotas.reduce(function(s, c) { return s + (c.estado === 'Pagado' ? c.montoPago : 0); }, 0);
    var pendiente = Math.max(0, item.montoTotal - pagado);
    var todosPagados = item.cuotas.every(function(c) { return c.estado === 'Pagado'; });
    return Object.assign({}, item, { pagado: pagado, pendiente: pendiente, estadoGeneral: todosPagados ? 'Pagado' : 'Pendiente' });
  });

  var finiquitos = items.filter(function(i) { return i.tipo === 'Finiquito'; });
  var prestamos  = items.filter(function(i) { return i.tipo !== 'Finiquito'; });

  var totalFinPend = finiquitos.reduce(function(s, f) { return s + f.pendiente; }, 0);
  var totalPrePend = prestamos.reduce(function(s, p) { return s + p.pendiente; }, 0);
  var totalPend    = totalFinPend + totalPrePend;
  var conPendiente = items.filter(function(i) { return i.estadoGeneral === 'Pendiente'; }).length;

  if (!FINIQUITOS_RAW.length) {
    return (
      <div className="page" style={{display:'flex',alignItems:'center',justifyContent:'center',minHeight:'60vh'}}>
        <div style={{textAlign:'center',color:'var(--t3)'}}>
          <IC n="fin" s={32}/>
          <div style={{marginTop:12,fontSize:14}}>Cargando datos de finiquitos...</div>
        </div>
      </div>
    );
  }

  function RowTabla({ item }) {
    var abierto = !!expandido[item.nombre];
    return (
      <>
        <tr style={{cursor:'pointer'}} onClick={function(){ setExpandido(function(prev){ var n=Object.assign({},prev); n[item.nombre]=!n[item.nombre]; return n; }); }}>
          <td style={{fontWeight:600}}>
            <span style={{marginRight:6,color:'var(--t3)',fontSize:11}}>{abierto?'▾':'▸'}</span>
            {item.nombre}
          </td>
          <td>{fmt(item.montoTotal)}</td>
          <td style={{color:'var(--g600)',fontWeight:600}}>{fmt(item.pagado)}</td>
          <td style={{color:item.pendiente>0?'var(--red)':'var(--t3)',fontWeight:item.pendiente>0?700:400}}>{item.pendiente>0?fmt(item.pendiente):'—'}</td>
          <td>
            <span style={{
              display:'inline-block',padding:'2px 9px',borderRadius:99,fontSize:11,fontWeight:700,
              background:item.estadoGeneral==='Pagado'?'oklch(93% .09 155)':'oklch(96% .08 75)',
              color:item.estadoGeneral==='Pagado'?'var(--g700)':'oklch(45% .17 75)'
            }}>{item.estadoGeneral}</span>
          </td>
          <td style={{color:'var(--t3)',fontSize:12}}>{item.cuotas.length} cuota{item.cuotas.length!==1?'s':''}</td>
        </tr>
        {abierto && item.cuotas.map(function(c, ci) {
          return (
            <tr key={ci} style={{background:'oklch(98% .005 240)'}}>
              <td style={{paddingLeft:28,color:'var(--t3)',fontSize:12}}>{c.comentario||('Cuota '+(ci+1))}</td>
              <td style={{fontSize:12,color:'var(--t3)'}}>{c.fecha||'—'}</td>
              <td style={{fontSize:12,color:'var(--g600)'}}>{c.montoPago>0?fmt(c.montoPago):'—'}</td>
              <td></td>
              <td>
                <span style={{
                  display:'inline-block',padding:'1px 7px',borderRadius:99,fontSize:11,fontWeight:600,
                  background:c.estado==='Pagado'?'oklch(93% .09 155)':'oklch(96% .08 75)',
                  color:c.estado==='Pagado'?'var(--g700)':'oklch(45% .17 75)'
                }}>{c.estado||'—'}</span>
              </td>
              <td></td>
            </tr>
          );
        })}
      </>
    );
  }

  function TablaSeccion({ titulo, datos, emptyMsg }) {
    if (!datos.length) return (
      <div className="card" style={{marginBottom:14}}>
        <div className="card-hd"><div className="card-title">{titulo}</div></div>
        <div style={{padding:'24px 20px',color:'var(--t3)',fontSize:13,textAlign:'center'}}>{emptyMsg}</div>
      </div>
    );
    return (
      <div className="card" style={{marginBottom:14}}>
        <div className="card-hd">
          <div>
            <div className="card-title">{titulo}</div>
            <div className="card-sub">
              {datos.length} registro{datos.length!==1?'s':''} ·
              Pendiente: {fmt(datos.reduce(function(s,d){return s+d.pendiente;},0))}
            </div>
          </div>
        </div>
        <table className="tbl">
          <thead>
            <tr>
              <th>Nombre</th>
              <th>Monto Total</th>
              <th>Pagado</th>
              <th>Pendiente</th>
              <th>Estado</th>
              <th>Cuotas</th>
            </tr>
          </thead>
          <tbody>
            {datos.map(function(item, idx) { return <RowTabla key={idx} item={item}/>; })}

  return (
    <div className="page">

      {/* KPIs */}
      <div className="kpi-grid-3" style={{marginBottom:14}}>
        <div className="kcard">
          <div className="kcard-icon a"><IC n="fin" s={15}/></div>
          <div className="kcard-label">Finiquitos Pendientes</div>
          <div className="kcard-val">{fmt(totalFinPend)}</div>

        </div>
        <div className="kcard">
          <div className="kcard-icon r"><IC n="cre" s={15}/></div>
          <div className="kcard-label">Préstamos Pendientes</div>
          <div className="kcard-val">{fmt(totalPrePend)}</div>
          <div className="kcard-change neu"><span className="sub">{prestamos.filter(function(p){return p.pendiente>0;}).length} con saldo pendiente</span></div>
        </div>
        <div className="kcard" style={{borderColor:conPendiente>0?'var(--amber)':'var(--border)'}}>
          <div className={`kcard-icon ${conPendiente>0?'a':'g'}`}>
            <svg width={15} height={15} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
              <polyline points="20 6 9 17 4 12"/>
            </svg>
          </div>
          <div className="kcard-label">Total Por Pagar</div>
          <div className="kcard-val" style={{color:totalPend>0?'oklch(45% .17 75)':'var(--g600)'}}>{fmt(totalPend)}</div>
          <div className={`kcard-change ${totalPend>0?'dn':'up'}`}>
            <span className="sub">{conPendiente>0?`${conPendiente} registros activos`:'Todo pagado'}</span>
          </div>
        </div>
      </div>

      <TablaSeccion titulo="Finiquitos" datos={finiquitos} emptyMsg="No hay finiquitos registrados"/>
      <TablaSeccion titulo="Préstamos a Trabajadores" datos={prestamos} emptyMsg="No hay préstamos a trabajadores registrados"/>

    </div>
  );
}

function CreditosPage({ saldos }) {
  const hoy = new Date().toISOString().split('T')[0];
  const hoyMs = new Date(hoy).getTime();

  // Enrich each credito with alert state
  const creditos = CREDITOS_REALES.map(c => {
    const saldoBanco = saldos[c.banco] || 0;
    const diasRestantes = Math.round((new Date(c.fechaProximaCuota) - new Date(hoy)) / 86400000);
    const alcanza = saldoBanco >= c.proximaCuota;
    const alertaVence = diasRestantes >= 0 && diasRestantes <= 2;
    const alertaSaldo = !alcanza;
    return { ...c, saldoBanco, diasRestantes, alcanza, alertaVence, alertaSaldo };
  });

  const totalDeuda = creditos.reduce((s,c) => s + (c.deudaVigente || 0), 0);
  const totalMontoInicial = creditos.reduce((s,c) => s + (c.montoInicial || c.deudaVigente || 0), 0);
  const cuotasEstesMes = creditos.reduce((s,c) => s + c.proximaCuota, 0);
  const conAlerta = creditos.filter(c => c.alertaVence || c.alertaSaldo);

  // Creditos por empresa
  const porEmpresa = {
    GMD: creditos.filter(c => c.empresa === 'GMD'),
    Grafhika: creditos.filter(c => c.empresa === 'Grafhika'),
  };

  const bancoBadgeColor = (banco) => {
    if (banco === 'Scotiabank') return 'oklch(52% .15 240)';
    if (banco.includes('SANTANDER')) return 'var(--red)';
    if (banco.includes('BancoChile') || banco.includes('Chile')) return 'var(--g600)';
    return 'var(--t3)';

  return (
    <div className="page">

      {/* KPIs */}
      <div className="kpi-grid-3" style={{marginBottom:14}}>
        <div className="kcard">
          <div className="kcard-icon r"><IC n="cre" s={15}/></div>

          <div className="kcard-icon a"><IC n="gas" s={15}/></div>
          <div className="kcard-label">Cuotas Este Mes</div>
          <div className="kcard-val">{fmt(cuotasEstesMes)}</div>
          <div className="kcard-change neu"><span className="sub">vencen en mayo 2026</span></div>
        </div>
        <div className="kcard" style={{borderColor: conAlerta.length>0 ? 'var(--red)' : 'var(--border)'}}>
          <div className={`kcard-icon ${conAlerta.length>0?'r':'g'}`}>
            <svg width={15} height={15} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
              <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 0 1-3.46 0"/>
            </svg>
          </div>

          <div className={`kcard-change ${conAlerta.length>0?'dn':'up'}`}>
            <span className="sub">{conAlerta.length>0 ? `${conAlerta.length} requieren atención` : 'Todo en orden'}</span>
          </div>

                <div style={{fontWeight:700,fontSize:13}}>
                  {c.prestamo}
                  <span style={{fontWeight:400,color:'var(--t3)',marginLeft:6,fontSize:12}}>({c.banco} · {c.empresa})</span>
                </div>

          ))}
        </div>
