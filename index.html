// ── Alert System ──────────────────────────────────────────────────────────
const DEFAULT_UMBRALES = {
  'Grafhika BancoChile': 1000000,
  'GMD BancoChile': 10000000,
  'Scotiabank': 3000000,
  'SANTANDER': 10000000,
  'BICE': 0,
  'BCI': 0,
};

function useAlerts(saldos, umbrales) {
  return useMemo(() => {
    const alerts = [];
    const hoy = new Date();

    // Alertas de saldo bajo por umbral configurado
    Object.entries(saldos).forEach(([banco, saldo]) => {
      const umbral = umbrales[banco] || 0;
      if (saldo < umbral * 0.5) {
        alerts.push({ id: banco+'_crit', tipo: 'crit', banco, saldo, umbral, msg: `⚠ ${banco} en alerta roja — solo ${fmt(saldo)} de ${fmt(umbral)} mínimo` });
      } else if (saldo < umbral) {
        alerts.push({ id: banco+'_warn', tipo: 'warn', banco, saldo, umbral, msg: `${banco} con saldo bajo — ${fmt(saldo)} de ${fmt(umbral)} mínimo` });
      }
    });

    // Alertas de créditos: solo 0, 1 o 2 días para vencer
    CREDITOS_REALES.forEach(c => {
      const saldoBanco = saldos[c.banco] || 0;
      const dias = Math.round((new Date(c.fechaProximaCuota) - hoy) / 86400000);
      const diasLabel = dias === 0 ? 'HOY' : dias === 1 ? 'mañana' : 'en 2 días';
      if (dias < 0 || dias > 2) return;
      const alcanza = saldoBanco >= c.proximaCuota;
      if (!alcanza) {
        alerts.push({ id: c.id+'_crit', tipo: 'crit', banco: c.banco,
          msg: `⚠ Cuota ${c.prestamo} vence ${diasLabel} — sin fondos en ${c.banco} (necesita ${fmt(c.proximaCuota)}, tiene ${fmt(saldoBanco)})` });
      } else {
        alerts.push({ id: c.id+'_vence', tipo: 'crit', banco: c.banco,
          msg: `⚠ Cuota ${c.prestamo} vence ${diasLabel} — ${fmt(c.proximaCuota)} desde ${c.banco}` });
      }
    });

    // Alertas de proyección (GASTOS): solo 0, 1 o 2 días para vencer
    if (typeof GASTOS !== 'undefined') {
      GASTOS.filter(g => g.estado !== 'Pagado').forEach(g => {
        const dias = Math.round((new Date(g.fecha) - hoy) / 86400000);
        if (dias < 0 || dias > 2) return;
        const diasLabel = dias === 0 ? 'HOY' : dias === 1 ? 'mañana' : 'en 2 días';
        alerts.push({ id: 'gasto_'+g.fecha+'_'+g.descripcion.slice(0,10), tipo: 'crit', banco: '',
          msg: `⚠ Pago "${g.descripcion}" vence ${diasLabel} — ${fmt(g.monto)}` });
      });
    }

    return alerts;
  }, [saldos, umbrales]);
}

function AlertStrip({ alerts, onClose }) {
  if (!alerts.length) return null;
  return (
    <div className="alert-strip">
      {alerts.map(a => (
        <div key={a.id} className={`alert-chip ${a.tipo}`}>
          {a.tipo!=='crit'&&<span className="alert-chip-icon">⚡</span>}
          <span className="alert-chip-txt">{a.msg}</span>
          <button className="alert-close" onClick={() => onClose(a.id)}>×</button>
        </div>
      ))}
    </div>
  );
}

// ── Upload de Movimientos ─────────────────────────────────────────────────
function UploadMovPanel({ onImport, onClose }) {
  const [drag, setDrag] = useState(false);
  const [status, setStatus] = useState('idle'); // idle | loading | success | error
  const [resultado, setResultado] = useState(null);
  const [errorMsg, setErrorMsg] = useState('');
  const fileRef = React.useRef();

  const processFile = (file) => {
    if (!file) return;
    setStatus('loading');
    setErrorMsg('');
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const wb = XLSX.read(e.target.result, { type: 'binary', cellDates: true });
        const ws = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(ws, { defval: '' });

        // Detect columns
        const colMap = {};
        if (rows.length > 0) {
          const keys = Object.keys(rows[0]);
          keys.forEach(k => {
            const kl = k.toLowerCase();
            if (kl.includes('fecha')) colMap.fecha = k;
            if (kl.includes('desc') || kl.includes('glosa') || kl.includes('detalle')) colMap.descripcion = k;
            if (kl.includes('monto') || kl.includes('cargo') || kl.includes('abono') || kl.includes('importe')) colMap.monto = k;
            if (kl.includes('banco') || kl.includes('cuenta')) colMap.banco = k;
            if (kl.includes('saldo')) colMap.saldo = k;
            if (kl.includes('tipo') || kl.includes('naturaleza')) colMap.tipo = k;
          });
        }

        const movs = rows.map(r => {
          let fecha = r[colMap.fecha] || '';
          if (fecha instanceof Date) fecha = fecha.toISOString().slice(0,10);
          else if (typeof fecha === 'number') {
            // Excel serial date
            const d = new Date(Math.round((fecha - 25569) * 86400 * 1000));
            fecha = d.toISOString().slice(0,10);
          } else {
            fecha = String(fecha).slice(0,10);
          }
          const monto = parseFloat(String(r[colMap.monto]||0).replace(/[^0-9.-]/g,'')) || 0;
          const tipo = monto >= 0 ? 'INGRESO' : 'GASTO';
          return {
            fecha,
            descripcion: String(r[colMap.descripcion] || '').trim(),
            monto,
            tipo: r[colMap.tipo] ? String(r[colMap.tipo]).toUpperCase() : tipo,
            banco: String(r[colMap.banco] || 'Importado').trim(),
            saldo: parseFloat(String(r[colMap.saldo]||0).replace(/[^0-9.-]/g,'')) || 0,
          };
        }).filter(m => m.fecha && m.descripcion);

        if (movs.length === 0) throw new Error('No se encontraron movimientos válidos en el archivo.');
        setResultado({ file: file.name, count: movs.length, movs, cols: colMap });
        setStatus('success');
      } catch (err) {
        setStatus('error');
        setErrorMsg(err.message || 'Error al procesar el archivo.');
      }
    };
    reader.readAsBinaryString(file);
  };

  const handleDrop = (e) => {
    e.preventDefault(); setDrag(false);
    const f = e.dataTransfer.files[0];
    if (f) processFile(f);
  };

  const confirmar = () => {
    if (resultado) { onImport(resultado.movs); onClose(); }
  };

  return (
    <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,.35)',z:400,display:'flex',alignItems:'center',justifyContent:'center',zIndex:400}}>
      <div style={{background:'var(--surface)',borderRadius:16,padding:24,width:480,maxWidth:'90vw',boxShadow:'0 16px 48px rgba(0,0,0,.2)'}}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:18}}>
          <div style={{fontSize:15,fontWeight:700}}>Importar Movimientos</div>
          <button onClick={onClose} style={{background:'none',border:'none',cursor:'pointer',color:'var(--t3)',fontSize:20,lineHeight:1}}>×</button>
        </div>

        {status === 'idle' && (
          <>
            <div
              className={`upload-zone ${drag?'drag':''}`}
              onDragOver={e=>{e.preventDefault();setDrag(true)}}
              onDragLeave={()=>setDrag(false)}
              onDrop={handleDrop}
              onClick={()=>fileRef.current.click()}
            >
              <div className="upload-icon">
                <svg width={20} height={20} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                  <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>
                </svg>
              </div>
              <div className="upload-title">Arrastra tu archivo Excel aquí</div>
              <div className="upload-sub">o haz clic para seleccionar · .xlsx / .xls / .csv</div>
            </div>
            <input ref={fileRef} type="file" accept=".xlsx,.xls,.csv" style={{display:'none'}} onChange={e=>processFile(e.target.files[0])}/>
            <div style={{marginTop:14,padding:'10px 12px',background:'var(--bg)',borderRadius:8,fontSize:13.5,color:'var(--t3)'}}>
              El archivo debe tener columnas de <b>Fecha</b>, <b>Descripción</b> y <b>Monto</b>. Las columnas de Banco, Tipo y Saldo son opcionales.
            </div>
          </>
        )}

        {status === 'loading' && (
          <div style={{textAlign:'center',padding:'32px 0',color:'var(--t3)'}}>
            <div style={{fontSize:13}}>Procesando archivo...</div>
          </div>
        )}

        {status === 'error' && (
          <div>
            <div style={{padding:'14px',background:'var(--red-bg)',borderRadius:8,color:'var(--red)',fontSize:13,marginBottom:14}}>{errorMsg}</div>
            <button onClick={()=>setStatus('idle')} style={{padding:'7px 16px',background:'var(--bg)',border:'1px solid var(--border)',borderRadius:7,cursor:'pointer',fontSize:12.5,fontFamily:'DM Sans'}}>Intentar de nuevo</button>
          </div>
        )}

        {status === 'success' && resultado && (
          <div>
            <div style={{display:'flex',alignItems:'center',gap:10,padding:'12px 14px',background:'var(--g50)',border:'1px solid var(--g200)',borderRadius:8,marginBottom:16}}>
              <svg width={16} height={16} viewBox="0 0 24 24" fill="none" stroke="var(--g600)" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
              <div>
                <div style={{fontSize:13,fontWeight:600}}>{resultado.file}</div>
                <div style={{fontSize:13.5,color:'var(--t3)'}}>{resultado.count} movimientos detectados</div>
              </div>
            </div>
            <div style={{marginBottom:14}}>
              <div style={{fontSize:13,fontWeight:600,textTransform:'uppercase',letterSpacing:'.06em',color:'var(--t3)',marginBottom:8}}>Columnas detectadas</div>
              {Object.entries(resultado.cols).map(([campo, col]) => (
                <div key={campo} style={{display:'flex',gap:8,fontSize:12,marginBottom:4}}>
                  <span style={{color:'var(--t3)',minWidth:80,textTransform:'capitalize'}}>{campo}:</span>
                  <span style={{fontWeight:600,fontFamily:'DM Sans',fontSize:13}}>{col}</span>
                </div>
              ))}
            </div>
            <div style={{maxHeight:160,overflowY:'auto',border:'1px solid var(--border)',borderRadius:8,marginBottom:16}}>
              <table style={{width:'100%',borderCollapse:'collapse',fontSize:13}}>
                <thead><tr style={{background:'var(--bg)'}}>
                  <th style={{padding:'6px 10px',textAlign:'left',color:'var(--t3)',fontWeight:600}}>Fecha</th>
                  <th style={{padding:'6px 10px',textAlign:'left',color:'var(--t3)',fontWeight:600}}>Descripción</th>
                  <th style={{padding:'6px 10px',textAlign:'right',color:'var(--t3)',fontWeight:600}}>Monto</th>
                </tr></thead>
                <tbody>
                  {resultado.movs.slice(0,8).map((m,i) => (
                    <tr key={i} style={{borderTop:'1px solid var(--border)'}}>
                      <td style={{padding:'5px 10px',fontFamily:'DM Sans',fontSize:13}}>{m.fecha}</td>
                      <td style={{padding:'5px 10px',maxWidth:180,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{m.descripcion}</td>
                      <td style={{padding:'5px 10px',textAlign:'right',fontFamily:'DM Sans',fontWeight:600,color:m.monto>=0?'var(--g600)':'var(--red)'}}>{m.monto>=0?'+':''}{fmt(m.monto)}</td>
                    </tr>
                  ))}
                  {resultado.count > 8 && <tr><td colSpan={3} style={{padding:'6px 10px',textAlign:'center',color:'var(--t3)',fontSize:13}}>... y {resultado.count - 8} más</td></tr>}
                </tbody>
              </table>
            </div>
            <div style={{display:'flex',gap:8}}>
              <button onClick={confirmar} style={{flex:1,padding:'8px',background:'var(--g700)',color:'#fff',border:'none',borderRadius:7,cursor:'pointer',fontSize:13,fontWeight:600,fontFamily:'DM Sans'}}>
                Confirmar importación
              </button>
              <button onClick={()=>setStatus('idle')} style={{padding:'8px 14px',background:'var(--bg)',border:'1px solid var(--border)',borderRadius:7,cursor:'pointer',fontSize:12.5,fontFamily:'DM Sans',color:'var(--t2)'}}>
                Cancelar
              </button>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

// ── Upload Nómina Panel ────────────────────────────────────────────────────
function UploadNominaPanel({ onImport, onClose }) {
  const [drag, setDrag] = useState(false);
  const [status, setStatus] = useState('idle');
  const [resultado, setResultado] = useState(null);
  const [errorMsg, setErrorMsg] = useState('');
  const fileRef = React.useRef();

  const processFile = (file) => {
    if (!file) return;
    setStatus('loading'); setErrorMsg('');
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const wb = XLSX.read(e.target.result, { type:'binary', cellDates:false });
        const sn = wb.SheetNames[0];
        const rawRows = XLSX.utils.sheet_to_json(wb.Sheets[sn], { header:1, defval:'', raw:true });
        if (!rawRows.length) throw new Error('Hoja vacía.');

        // Detectar fila de encabezados: buscar "nombre" o "beneficiario"
        const hdrKw = /empresa|rut|nombre|beneficiario|monto|banco/i;
        let hIdx = rawRows.findIndex(row => row.filter(c => hdrKw.test(String(c))).length >= 2);
        if (hIdx < 0) hIdx = 0;
        const hdr = rawRows[hIdx];

        // Encontrar columnas por nombre
        const ci = (t) => { for(let i=0;i<hdr.length;i++){if(hdrKw.test(String(hdr[i]))&&String(hdr[i]).toLowerCase().includes(t))return i;} return -1; };
        const colEmp  = hdr.findIndex(h => /empresa/i.test(String(h)));
        const colNom  = hdr.findIndex(h => /nombre|beneficiario/i.test(String(h)));
        const colMont = hdr.findIndex(h => /monto/i.test(String(h)));
        if (colNom < 0 || colMont < 0) throw new Error('No se detectaron columnas Nombre y Monto en el archivo.');

        const pn = (v) => { if(!v) return 0; const n=parseInt(String(v).replace(/[^0-9]/g,'')); return isNaN(n)?0:n; };
        const dataRows = rawRows.slice(hIdx+1).filter(r => r.some(c => c!==''&&c!==null));

        // Agrupar por empresa
        const empMap = {};
        let total = 0;
        dataRows.forEach(r => {
          const emp = colEmp>=0 ? String(r[colEmp]||'').trim() : 'Sin empresa';
          const nom = String(r[colNom]||'').trim();
          const mto = pn(r[colMont]);
          if (!nom || mto <= 0) return; // excluir filas sin nombre o monto 0
          if (!emp || /total/i.test(emp)) return; // excluir fila de totales
          if (!empMap[emp]) empMap[emp] = { empresa: emp, personas: 0, monto: 0 };
          empMap[emp].personas++;
          empMap[emp].monto += mto;
          total += mto;
        });

        const byEmpresa = Object.values(empMap).filter(e => e.monto > 0).sort((a,b) => b.monto - a.monto);
        if (!byEmpresa.length) throw new Error('No se encontraron empleados con monto > 0.');

        // Intentar detectar mes del nombre del archivo
        const mesMatch = file.name.match(/(enero|febrero|marzo|abril|mayo|junio|julio|agosto|septiembre|octubre|noviembre|diciembre)[^\d]*(\d{4})/i);
        const mesStr = mesMatch ? mesMatch[1].charAt(0).toUpperCase()+mesMatch[1].slice(1).toLowerCase()+' '+mesMatch[2] : '';

        setResultado({ filename: file.name, byEmpresa, total, mesStr });
        setStatus('success');
      } catch(err) { setStatus('error'); setErrorMsg(err.message||'Error al procesar.'); }
    };
    reader.readAsBinaryString(file);
  };

  const confirmar = () => { if(resultado) { onImport(resultado); onClose(); } };

  return (

        {status==='idle' && (

            <div style={{fontSize:12.5,color:'var(--t3)',marginBottom:12,padding:'8px 12px',background:'var(--bg)',borderRadius:8}}>
              Formato esperado: <b>Empresa · Rut · Nombre · Monto · Banco · Tipo · N° Cuenta</b><br/>
              Compatible con el archivo mensual de transferencias bancarias.

            <div className={`upload-zone ${drag?'drag':''}`}

              <div>
                <div style={{fontSize:13,fontWeight:600}}>{resultado.filename}{resultado.mesStr?' · '+resultado.mesStr:''}</div>
                <div style={{fontSize:12.5,color:'var(--t3)'}}>{resultado.byEmpresa.reduce((s,e)=>s+e.personas,0)} empleados · Total: {fmt(resultado.total)}</div>

            <table style={{width:'100%',borderCollapse:'collapse',fontSize:13,marginBottom:16}}>
              <thead><tr style={{borderBottom:'1px solid var(--border)'}}><th style={{textAlign:'left',padding:'5px 8px',color:'var(--t3)',fontWeight:600,fontSize:11,textTransform:'uppercase'}}>Empresa</th><th style={{textAlign:'center',padding:'5px 4px',color:'var(--t3)',fontWeight:600,fontSize:11,textTransform:'uppercase'}}>Personas</th><th style={{textAlign:'right',padding:'5px 8px',color:'var(--t3)',fontWeight:600,fontSize:11,textTransform:'uppercase'}}>Monto</th></tr></thead>

// ── Upload Ventas Panel ────────────────────────────────────────────────────
function UploadVentasPanel({ onImport, onClose }) {
  const [drag, setDrag] = useState(false);
  const [status, setStatus] = useState('idle');
  const [resultado, setResultado] = useState(null);
  const [errorMsg, setErrorMsg] = useState('');
  const fileRef = React.useRef();

  const parseDate = (v) => {
    if (!v) return '';
    if (typeof v === 'number') { const d = new Date(Math.round((v-25569)*86400000)); return d.toISOString().slice(0,10); }
    const s = String(v).trim();
    if (s.match(/^\d{4}-\d{2}-\d{2}/)) return s.slice(0,10);
    if (s.match(/^\d{2}[/-]\d{2}[/-]\d{4}/)) { const p=s.split(/[/-]/); return `${p[2]}-${p[1].padStart(2,'0')}-${p[0].padStart(2,'0')}`; }
    return s.slice(0,10);
  };
  const parseMonto = (v) => {
    if(!v && v!==0) return 0;
    if(typeof v === 'number') return Math.round(v);
    let s = String(v).replace(/[$\s]/g,'').trim();
    // Detect thousands separator format
    const hasDot3 = /\.\d{3}/.test(s);   // dot before 3 digits → thousands sep (Chilean)
    const hasComma3 = /,\d{3}/.test(s);  // comma before 3 digits → thousands sep (US/SheetJS)
    if(hasDot3 && !hasComma3) s = s.replace(/\./g,'');          // "1.528.213" → "1528213"
    else if(hasComma3 && !hasDot3) s = s.replace(/,/g,'');      // "1,528,213" → "1528213"
    else if(hasDot3 && hasComma3) {
      if(s.lastIndexOf('.')>s.lastIndexOf(',')) s = s.replace(/,/g,'').split('.')[0]; // "1,528.00"
      else s = s.replace(/\./g,'').split(',')[0];                // "1.528,00"
    } else {
      s = s.replace(/,\d{1,2}$/, '').replace(/\.\d{1,2}$/, ''); // strip trailing decimal
    }
    return parseInt(s.replace(/[^\d]/g,''))||0;
  };

  const processFile = (file) => {
    if (!file) return;
    setStatus('loading'); setErrorMsg('');
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const wb = XLSX.read(e.target.result, { type:'binary', cellDates:false });
        // Find cobranza sheet — priorizar COBRANZA sobre FACTURAS
        const sn = wb.SheetNames.find(s => /cobr/i.test(s))
                || wb.SheetNames.find(s => /vent|libro/i.test(s))
                || wb.SheetNames.find(s => /factur/i.test(s))
                || wb.SheetNames[0];
        // Leer como arrays para encontrar la fila de encabezados real
        const rawRows = XLSX.utils.sheet_to_json(wb.Sheets[sn], { header:1, defval:'', raw:true });
        if (!rawRows.length) throw new Error('Hoja vacía o sin datos.');

        // Buscar la fila que contiene los encabezados reales
        // (la que tiene al menos 3 celdas con texto que parecen headers)
        const headerKeywords = /folio|factura|empresa|cliente|nombre|rut|codigo legal|código legal|total|monto|saldo|estado|fecha|emision|emisión|venc|ejecut|vendedor|neto|importe|observ|origen/i;
        // Elegir la fila de encabezados REAL: la que tiene MÁS coincidencias de keywords.
        // (evita confundir filas de resumen/KPIs como "TOTAL FACTURAS" con los encabezados reales)
        let headerRowIdx = 0, bestScore = 0;
        const scanLimit = Math.min(rawRows.length, 25);
        for (let i = 0; i < scanLimit; i++) {
          const score = rawRows[i].filter(c => headerKeywords.test(String(c))).length;
          if (score > bestScore) { bestScore = score; headerRowIdx = i; }
        }
        if (bestScore < 2) headerRowIdx = 0;

        const headerRow = rawRows[headerRowIdx];
        const dataRows  = rawRows.slice(headerRowIdx + 1).filter(r => r.some(c => c !== '' && c !== null));

        // Convertir a objetos usando los encabezados encontrados
        const rows = dataRows.map(row => {
          const obj = {};
          headerRow.forEach((h, i) => { obj[String(h||'').trim()] = row[i] ?? ''; });
          return obj;
        });
        if (!rows.length) throw new Error('Hoja vacía o sin datos.');

        // Detect columns
        const keys = Object.keys(rows[0]);
        const find = (...terms) => keys.find(k => terms.some(t => k.toLowerCase().includes(t.toLowerCase()))) || '';
        const cFolio   = find('folio','n°','nro','num','n∞','n º','#','doc');
        const cRut     = find('rut','código legal','codigo legal');
        const cEmpresa = find('empresa','cliente','razón','razon','nombre','razon social');
        const cFecha   = find('emision','emisión','fecha e','fecha d','f. e','f.e','fecha factura','f. factura');
        const cTotal   = find('total','monto total','valor total','importe','monto neto','valor neto','neto');
        const cSaldo   = find('saldo','por cobrar','pendiente','debe');
        const cEstado  = find('estado','situacion','situación','condicion','condición');
        const cVence   = find('vencim','vence','plazo','fecha venc','f. venc');
        const cDias    = find('dias venc','días venc','atraso','dias atraso','días atraso','mora');
        const cPago    = find('fecha p','f. p','f.p','fecha pago','f. pago','pago');
        const cEjec    = find('ejecutivo','vendedor','repr','ejecut','agente','responsable');
        const cObs     = find('obs','observ','detalle','nota','descrip','glosa');

        // DEBUG — ver en consola del navegador (F12)
        console.log('📋 Hojas disponibles:', wb.SheetNames);
        console.log('📋 Hoja seleccionada:', sn, '| Filas:', rows.length);
        console.log('📋 Columnas en Excel:', keys);
        console.log('📋 Columnas detectadas:', {folio:cFolio, empresa:cEmpresa, total:cTotal, saldo:cSaldo, estado:cEstado, fecha:cFecha, vence:cVence, ejecutivo:cEjec});
        console.log('📋 Primera fila raw:', rows[0]);
        const buscaFolio = rows.filter(r => Object.values(r).some(v => String(v).includes('2424')));
        if(buscaFolio.length) console.log('🔍 Filas con "2424":', buscaFolio);
        else console.log('🔍 No hay ninguna fila con "2424" en el Excel');

        const hoy = new Date();
        const noSaldoCol = !cSaldo; // if no saldo column detected
        const pending = rows.filter(r => r[cFolio] || r[cEmpresa]).map(r => {
          const total = parseMonto(r[cTotal]);
          // If no saldo column, derive from estado: PAGADO→0, else total
          const rawSaldo = noSaldoCol ? 0 : parseMonto(r[cSaldo]);
          const estadoRaw = String(r[cEstado]||'').trim().toUpperCase();
          const saldo = noSaldoCol
            ? (/pagado|cobrado|cancelado/i.test(estadoRaw) ? 0 : total)
            : rawSaldo;
          const estado = estadoRaw || (saldo===0?'PAGADO':'PENDIENTE');
          const venc = parseDate(r[cVence]);
          const diasVencido = r[cDias] ? parseInt(r[cDias])||0 : (venc&&saldo>0 ? Math.max(0,Math.round((hoy-new Date(venc))/86400000)) : 0);
          const folioRaw = String(r[cFolio]||'').trim();
          return {
            rut: String(r[cRut]||'').trim(),
            empresa: String(r[cEmpresa]||r[cRut]||'SIN NOMBRE').trim().toUpperCase(),
            folio: parseInt(folioRaw)||0,
            folioStr: folioRaw,
            fechaEmision: parseDate(r[cFecha]),
            total, saldo,
            obs: String(r[cObs]||'').replace(/_x000D_/g,'').trim(),
            vencimiento: venc,
            diasVencido,
            estado,
            fechaPago: parseDate(r[cPago]),
            ejecutivo: String(r[cEjec]||'').trim().toUpperCase(),
          };
        }).filter(r => r.total > 0);

        if (!pending.length) throw new Error(`No se encontraron facturas válidas.\n\nColumnas en hoja "${sn}":\n${keys.join(' | ')}\n\nDetectado: total="${cTotal||'NO ENCONTRADO'}" · saldo="${cSaldo||'NO ENCONTRADO'}" · empresa="${cEmpresa||'NO ENCONTRADO'}"\n\nPrimera fila: ${JSON.stringify(rows[0]).slice(0,300)}`);

        // Compute KPIs
        const totalFacturado = pending.reduce((s,r)=>s+r.total,0);
        const totalSaldo = pending.reduce((s,r)=>s+r.saldo,0);
        const totalPagado = pending.filter(r=>r.estado==='PAGADO'||r.saldo===0).reduce((s,r)=>s+r.total-r.saldo,0);
        const totalFactoring = pending.filter(r=>r.estado==='FACTORING').reduce((s,r)=>s+r.total,0);
        const countVencido = pending.filter(r=>r.estado==='VENCIDO').length;
        const saldoVencido = pending.filter(r=>r.estado==='VENCIDO').reduce((s,r)=>s+r.saldo,0);
        const countPendiente = pending.filter(r=>r.estado==='PENDIENTE').length;
        const saldoPendiente = pending.filter(r=>r.estado==='PENDIENTE').reduce((s,r)=>s+r.saldo,0);
        const countFactoring = pending.filter(r=>r.estado==='FACTORING').length;
        const countNCredito = pending.filter(r=>r.estado==='NCREDITO').length;
        const kpis = { totalFacturado, totalSaldo, totalPagado, totalFactoring, countDocs:pending.length, countVencido, saldoVencido, countPendiente, saldoPendiente, countFactoring, countNCredito };

        // COB_POR_MES — calculado sobre todos los registros
        const porMes = {};
        pending.forEach(r=>{ const m=r.fechaEmision.slice(0,7); if(!m) return; if(!porMes[m]) porMes[m]={total:0,saldo:0,count:0,pagado:0}; porMes[m].total+=r.total; porMes[m].saldo+=r.saldo; porMes[m].count++; porMes[m].pagado+=(r.total-r.saldo); });

        // COB_POR_EJECUTIVO — calculado sobre todos los registros
        const porEj = {};
        pending.forEach(r=>{ const e=r.ejecutivo||'SIN ASIGNAR'; if(!porEj[e]) porEj[e]={total:0,saldo:0,count:0}; porEj[e].total+=r.total; porEj[e].saldo+=r.saldo; porEj[e].count++; });

        // COB_TOP_CLIENTES — calculado sobre todos los registros
        const clMap = {};
        pending.forEach(r=>{ if(!clMap[r.empresa]) clMap[r.empresa]={empresa:r.empresa,total:0,saldo:0,docs:0}; clMap[r.empresa].total+=r.total; clMap[r.empresa].saldo+=r.saldo; clMap[r.empresa].docs++; });
        const topClientes = Object.values(clMap).sort((a,b)=>b.total-a.total).slice(0,20);

        // Guardar TODOS los registros — el límite se aplica en la UI solo cuando no hay búsqueda
        setResultado({ file:file.name, sheetName:sn, count:pending.length, kpis, porMes, porEj, topClientes, pending, cols:{folio:cFolio,empresa:cEmpresa,total:cTotal,saldo:cSaldo||'(calculado)',estado:cEstado}, allKeys:keys.slice(0,20) });
        setStatus('success');
      } catch(err) { setStatus('error'); setErrorMsg(err.message||'Error al procesar el archivo.'); }
    };
    reader.readAsBinaryString(file);
  };

  const confirmar = () => { if(resultado) { onImport(resultado); onClose(); } };

  return (
    <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,.35)',zIndex:400,display:'flex',alignItems:'center',justifyContent:'center'}}>
      <div style={{background:'var(--surface)',borderRadius:16,padding:24,width:500,maxWidth:'92vw',boxShadow:'0 16px 48px rgba(0,0,0,.2)'}}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:18}}>
          <div style={{fontSize:15,fontWeight:700}}>Actualizar Ventas / Cobranza</div>
          <button onClick={onClose} style={{background:'none',border:'none',cursor:'pointer',color:'var(--t3)',fontSize:20,lineHeight:1}}>×</button>
        </div>

        {status==='idle' && (
          <>
            <div className={`upload-zone ${drag?'drag':''}`} onDragOver={e=>{e.preventDefault();setDrag(true)}} onDragLeave={()=>setDrag(false)} onDrop={e=>{e.preventDefault();setDrag(false);processFile(e.dataTransfer.files[0])}} onClick={()=>fileRef.current.click()}>
              <div className="upload-icon"><svg width={20} height={20} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg></div>
              <div className="upload-title">Arrastra tu archivo Excel aquí</div>
              <div className="upload-sub">2026 LIBRO VENTA GMD - COBRANZA.xlsx · Hoja: COBRANZA</div>
            </div>
            <input ref={fileRef} type="file" accept=".xlsx,.xls" style={{display:'none'}} onChange={e=>processFile(e.target.files[0])}/>
          </>
        )}

        {status==='loading' && <div style={{textAlign:'center',padding:'32px 0',color:'var(--t3)',fontSize:13}}>Procesando archivo...</div>}

        {status==='error' && (
          <div>
            <div style={{padding:14,background:'var(--red-bg)',borderRadius:8,color:'var(--red)',fontSize:12,marginBottom:14,whiteSpace:'pre-wrap',maxHeight:260,overflowY:'auto',fontFamily:'DM Mono,monospace',lineHeight:1.6}}>{errorMsg}</div>
            <button onClick={()=>setStatus('idle')} style={{padding:'7px 16px',background:'var(--bg)',border:'1px solid var(--border)',borderRadius:7,cursor:'pointer',fontSize:12.5,fontFamily:'DM Sans'}}>Intentar de nuevo</button>
          </div>
        )}

        {status==='success' && resultado && (
          <div>
            <div style={{display:'flex',alignItems:'center',gap:10,padding:'10px 14px',background:'var(--g50)',border:'1px solid var(--g200)',borderRadius:8,marginBottom:14}}>
              <svg width={16} height={16} viewBox="0 0 24 24" fill="none" stroke="var(--g600)" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
              <div>
                <div style={{fontSize:13,fontWeight:600}}>{resultado.file} · Hoja: {resultado.sheetName}</div>
                <div style={{fontSize:12.5,color:'var(--t3)'}}>{resultado.count} docs totales · {resultado.pending.filter(r=>r.estado!=='PAGADO'&&r.saldo>0).length} pendientes + 50 últ. pagados · Total: {fmt(resultado.kpis.totalFacturado)}</div>
              </div>
            </div>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8,marginBottom:14}}>
              {[['Total facturado',resultado.kpis.totalFacturado,'g'],['Saldo por cobrar',resultado.kpis.totalSaldo,'a'],['Cobrado/Pagado',resultado.kpis.totalPagado,'g'],['En factoring',resultado.kpis.totalFactoring,'b']].map(([l,v,c])=>(
                <div key={l} style={{padding:'8px 12px',background:'var(--bg)',borderRadius:8,border:'1px solid var(--border)'}}>
                  <div style={{fontSize:11,color:'var(--t3)',marginBottom:2,textTransform:'uppercase',letterSpacing:'.05em'}}>{l}</div>
                  <div style={{fontSize:14,fontWeight:700,color:`var(--${c==='g'?'g600':c==='a'?'amber':'blue'})`}}>{fmt(v)}</div>
                </div>
              ))}
            </div>
            <div style={{fontSize:12,color:'var(--t3)',marginBottom:14,padding:'8px 12px',background:'var(--bg)',borderRadius:7}}>
              <div style={{marginBottom:4}}>Columnas detectadas: folio→<b>{resultado.cols.folio||'?'}</b> · empresa→<b>{resultado.cols.empresa||'?'}</b> · total→<b>{resultado.cols.total||'?'}</b> · saldo→<b>{resultado.cols.saldo||'?'}</b> · estado→<b>{resultado.cols.estado||'?'}</b></div>
              <div style={{color:'var(--t3)',fontSize:11}}>Columnas en hoja: {resultado.allKeys.join(' · ')}</div>
            </div>
            <div style={{display:'flex',gap:8}}>
              <button onClick={confirmar} style={{flex:1,padding:'9px',background:'var(--g700)',color:'#fff',border:'none',borderRadius:7,cursor:'pointer',fontSize:13,fontWeight:600,fontFamily:'DM Sans'}}>Confirmar e importar</button>
              <button onClick={()=>setStatus('idle')} style={{padding:'9px 14px',background:'var(--bg)',border:'1px solid var(--border)',borderRadius:7,cursor:'pointer',fontSize:12.5,fontFamily:'DM Sans',color:'var(--t2)'}}>Cancelar</button>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

function HomePage({ saldos, movByMonth, gastos, ventas, creditos, fondos, alerts, onNavTo }) {
  const totalBancario = Object.values(saldos).reduce((a,b)=>a+b,0);
  const meses = Object.keys(movByMonth);
  const curMes = movByMonth[meses[meses.length-1]] || {ingresos:0,gastos:0};
  const prevMes = movByMonth[meses[meses.length-2]] || {ingresos:0,gastos:0};
  const flujoNeto = curMes.ingresos - curMes.gastos;
  const pendientes = gastos.filter(g=>g.estado==='Pendiente');
  const totalPend = pendientes.reduce((s,g)=>s+g.monto,0);
  const vencHoy = pendientes.filter(g=>g.fecha <= new Date().toISOString().split('T')[0]).length;
  const totalFondos = fondos.length ? fondos[fondos.length-1].total : 0;
  const prevFondos = fondos.length > 1 ? fondos[fondos.length-2].total : totalFondos;
  const totalDeuda = CREDITOS_REALES.reduce((s,c)=>s+(c.deudaVigente||0),0);
  const totalVentas = COB_KPIS ? COB_KPIS.totalFacturado : 0;
  const ventasPend = COB_KPIS ? COB_KPIS.totalSaldo : 0;

  // Mini sparkline for saldos (last 4 months flow)
  const months4 = meses.slice(-4);

// ── App ──────────────────────────────────────────────────────────────────
function PinLock({ 
  onUnlock, 
  onGoogleLogin, 
  isFirebaseConfigured, 
  loading, 
  onReinitFirebase, 
  accessDeniedReason, 
  onClearAccessDenied,
  lastFailedUser,
  onRequestAccess,
  accessDeniedMessage
}) {
  const [showConfigForm, setShowConfigForm] = useState(false);
  const [configInput, setConfigInput] = useState(() => localStorage.getItem('FIREBASE_CONFIG') || '');
  const [configError, setConfigError] = useState('');
  const [requestStatus, setRequestStatus] = useState('idle'); // 'idle' | 'sending' | 'success' | 'error'
  const [requestError, setRequestError] = useState('');

  const handleSaveConfig = () => {
    try {
      let cleanInput = configInput.trim();
      if (!cleanInput) {
        localStorage.removeItem('FIREBASE_CONFIG');
        alert("⚠️ Configuración de Firebase eliminada. Regresando a la pantalla de configuración de inicio.");
        window.location.reload();
        return;
      }
      
      let parsed = null;
      try {
        parsed = JSON.parse(cleanInput);
      } catch (err) {
        // Relaxed parser for copy-pasted JavaScript config objects from Firebase Console
        const config = {};
        const keys = ['apiKey', 'authDomain', 'projectId', 'storageBucket', 'messagingSenderId', 'appId'];
        keys.forEach(k => {
          const match = cleanInput.match(new RegExp(`['"]?${k}['"]?\\s*:\\s*['"]([^'"]+)['"]`));
          if (match && match[1]) config[k] = match[1].trim();
        });
        if (config.apiKey && config.projectId) {
          parsed = config;
        }
      }
      
      if (!parsed || !parsed.apiKey || !parsed.projectId) {
        throw new Error("No se pudo detectar una configuración de Firebase válida. Asegúrate de copiar el objeto de configuración completo que contiene 'apiKey' y 'projectId'.");
      }

      localStorage.setItem('FIREBASE_CONFIG', JSON.stringify(parsed));
      setConfigError('');
      alert("✅ Configuración de Firebase guardada con éxito. La página se recargará para aplicar los cambios.");
      window.location.reload();
    } catch (e) {
      console.error(e);
      setConfigError(e.message || "Formato JSON inválido. Revisa las comas y comillas.");
    }
  };

  const isSuspended = accessDeniedReason === 'suspended';
  const isConnectionError = accessDeniedReason === 'connection_error';
  const hasDenied = !!accessDeniedReason;

  return (
    <div style={{position:'fixed',inset:0,background:'var(--g900)',zIndex:999,display:'flex',alignItems:'center',justifyContent:'center',flexDirection:'column',gap:0,fontFamily:'\'DM Sans\', sans-serif'}}>
      
      {/* Loading overlay during auth/sync */}
      {loading && (
        <div style={{position:'absolute',inset:0,background:'rgba(22, 28, 45, 0.95)',backdropFilter:'blur(10px)',zIndex:1000,display:'flex',alignItems:'center',justifyContent:'center',flexDirection:'column',gap:20}}>
          <div style={{width:50,height:50,border:'3px solid rgba(255,255,255,0.1)',borderTopColor:'oklch(60% .14 155)',borderRadius:'50%',animation:'spin 0.8s linear infinite'}}/>
          <div style={{color:'rgba(255,255,255,0.85)',fontSize:15,fontWeight:500,letterSpacing:'-0.2px'}}>Sincronizando datos con la nube de Firebase...</div>
        </div>
      )}

      {/* Access Denied UI */}
      {hasDenied && (
        <div style={{
          display:'flex', 
          flexDirection:'column', 
          alignItems:'center', 
          maxWidth:350, 
          padding:28, 
          background:'rgba(22, 28, 45, 0.65)', 
          backdropFilter:'blur(20px)',
          border: '1.5px solid ' + (isSuspended ? 'var(--red)' : (isConnectionError ? 'oklch(72% .18 75)' : 'rgba(255,255,255,0.15)')), 
          borderRadius:20, 
          boxShadow: '0 20px 50px ' + (isSuspended ? 'rgba(220,38,38,0.25)' : (isConnectionError ? 'rgba(245,158,11,0.2)' : 'rgba(0,0,0,0.3)')), 
          textAlign:'center', 
          animation:'pinShake 0.3s ease-out'
        }}>
          <div style={{
            width:56, 
            height:56, 
            background: isSuspended ? 'rgba(220,38,38,0.15)' : (isConnectionError ? 'rgba(245,158,11,0.15)' : 'rgba(255,255,255,0.08)'), 
            border: '2px solid ' + (isSuspended ? 'var(--red)' : (isConnectionError ? 'oklch(72% .18 75)' : 'rgba(255,255,255,0.25)')), 
            borderRadius:'50%', 
            display:'flex', 
            alignItems:'center', 
            justifyContent:'center', 
            fontSize:26, 
            marginBottom:16
          }}>
            {isSuspended ? '🚫' : (isConnectionError ? '📡' : '⚠️')}
          </div>
          <div style={{
            fontSize:18, 
            fontWeight:700, 
            color: isSuspended ? '#ff8080' : (isConnectionError ? '#fbbf24' : '#fff'), 
            letterSpacing:'-0.3px',

          {!isSuspended && !isConnectionError && lastFailedUser && (
            <div style={{width:'100%', marginTop:-10, marginBottom:16}}>
              {requestStatus === 'idle' && (

                  onClick={async () => {
                    setRequestStatus('sending');

                      await onRequestAccess(lastFailedUser);
                      setRequestStatus('success');

                    width:'100%',
                    height:38,

                    borderRadius:8,
                    fontWeight:600,
                    fontSize:12.5,
                    cursor:'pointer',

                <div style={{display:'flex',alignItems:'center',justifyContent:'center',gap:8,padding:'8px 0'}}>

              {requestStatus === 'success' && (
                <div style={{background:'rgba(16,185,129,0.1)',border:'1px solid #10b981',borderRadius:8,padding:12,textAlign:'left'}}>
                  <div style={{color:'#34d399',fontWeight:700,fontSize:12.5,marginBottom:4,display:'flex',alignItems:'center',gap:6}}>
                    <span>✓</span> ¡Solicitud Enviada!
                  </div>
                  <div style={{fontSize:11.5,color:'rgba(255,255,255,0.75)',lineHeight:1.4}}>
                    Se ha notificado al administrador por correo electrónico. Te llegará un correo cuando se apruebe.

              {requestStatus === 'error' && (
                <div style={{background:'rgba(220,38,38,0.1)',border:'1px solid var(--red)',borderRadius:8,padding:12,textAlign:'left'}}>
                  <div style={{color:'#ff8080',fontWeight:700,fontSize:12.5,marginBottom:4}}>
                    ❌ Error al enviar solicitud
                  </div>
                  <div style={{fontSize:11.5,color:'rgba(255,255,255,0.7)',marginBottom:8}}>{requestError}</div>
                  <button
                    onClick={() => setRequestStatus('idle')}
                    style={{background:'rgba(255,255,255,0.15)',border:'none',borderRadius:4,color:'#fff',fontSize:11,fontWeight:600,padding:'4px 8px',cursor:'pointer'}}
                  >
                    Reintentar
                  </button>
                </div>
              )}
            </div>
          )}

          <button 
            onClick={onClearAccessDenied}
            style={{
              width:'100%',
              height:38,
              background: isConnectionError ? 'oklch(72% .18 75)' : ((!isSuspended && requestStatus === 'success') ? 'var(--g700)' : 'var(--red)'),
              color: isConnectionError ? 'var(--g900)' : '#fff',
              border:'none',
              borderRadius:8,
              fontWeight:700,
              fontSize:12.5,
              cursor:'pointer',
              boxShadow: (isConnectionError || (!isSuspended && requestStatus === 'success')) ? 'none' : '0 4px 12px rgba(220,38,38,0.3)',
              transition:'all 0.15s',
              fontFamily:'\'DM Sans\', sans-serif'
            }}
            onMouseEnter={e=>e.currentTarget.style.background=isConnectionError ? 'oklch(77% .16 75)' : ((!isSuspended && requestStatus === 'success') ? 'var(--g600)' : 'oklch(50% .18 25)')}
            onMouseLeave={e=>e.currentTarget.style.background=isConnectionError ? 'oklch(72% .18 75)' : ((!isSuspended && requestStatus === 'success') ? 'var(--g700)' : 'var(--red)')}
          >
            {isConnectionError ? 'Reintentar Conexión' : ((!isSuspended && requestStatus === 'success') ? 'Volver' : 'Volver a Intentar')}
          </button>
        </div>
      )}

      {/* Main panel */}
      <div style={{display: (showConfigForm || hasDenied) ? 'none' : 'flex', flexDirection: 'column', alignItems: 'center'}}>
        <div style={{textAlign:'center',marginBottom:28}}>
          <div style={{width:52,height:52,background:'var(--g600)',borderRadius:16,display:'flex',alignItems:'center',justifyContent:'center',margin:'0 auto 16px',fontSize:24,boxShadow:'0 8px 30px rgba(0,0,0,0.3)'}}>🔒</div>
          <div style={{fontSize:22,fontWeight:700,color:'#fff',letterSpacing:'-0.5px'}}>Dashboard Financiero</div>
          <div style={{fontSize:13,color:'var(--g400)',marginTop:5}}>
            {isFirebaseConfigured ? 'Inicia sesión con tu cuenta Google para continuar' : 'Configura la conexión a tu servidor en la nube para continuar'}
          </div>
        </div>

        {/* Google Login Button */}
        {isFirebaseConfigured && (
          <button 
            onClick={onGoogleLogin}
            style={{
              display:'flex',
              alignItems:'center',
              justifyContent:'center',
              gap:12,
              width:236,
              height:46,
              background:'#fff',
              border:'none',
              borderRadius:10,
              color:'#1e293b',
              fontWeight:600,
              fontSize:13.5,
              cursor:'pointer',
              marginBottom:24,
              boxShadow:'0 4px 20px rgba(0,0,0,0.15)',
              transition:'transform 0.15s, box-shadow 0.15s',
              fontFamily:'\'DM Sans\', sans-serif'

            onMouseEnter={e=>{e.currentTarget.style.transform='scale(1.02)';e.currentTarget.style.boxShadow='0 6px 24px rgba(0,0,0,0.25)'}}
            onMouseLeave={e=>{e.currentTarget.style.transform='scale(1)';e.currentTarget.style.boxShadow='0 4px 20px rgba(0,0,0,0.15)'}}
          >
            {/* Google Icon SVG */}
            <svg width="18" height="18" viewBox="0 0 24 24">
              <path fill="#EA4335" d="M12.24 10.285V14.4h6.887c-.275 1.565-1.88 4.604-6.887 4.604-4.33 0-7.859-3.578-7.859-8s3.53-8 7.859-8c2.46 0 4.105 1.025 5.047 1.926l3.245-3.125C18.465 1.838 15.65 1 12.24 1 5.92 1 1 5.92 1 12.24s4.92 11.24 11.24 11.24c6.6 0 11-4.604 11-11.24 0-.765-.08-1.346-.245-1.955H12.24z"/>
            </svg>
            Acceder con Google
          </button>
        )}

        {/* Prompt to configure Cloud (rendered only when Firebase is not connected) */}
        {!isFirebaseConfigured && (
          <div style={{textAlign:'center',padding:'16px 20px',background:'rgba(255,255,255,0.03)',border:'1px solid rgba(255,255,255,0.08)',borderRadius:12,maxWidth:280}}>
            <div style={{fontSize:28,marginBottom:12}}>☁️</div>
            <div style={{fontSize:14,fontWeight:600,color:'#fff',lineHeight:1.4}}>Acceso Protegido por Servidor Nube</div>
            <div style={{fontSize:12,color:'var(--g400)',marginTop:8,lineHeight:1.4}}>
              Para comenzar a utilizar el dashboard, por favor haz clic en el botón de abajo y configura las credenciales de tu servidor Firebase.
            </div>
          </div>
        )}
      </div>

      {/* Cloud Settings Configuration Popup Form */}
      {showConfigForm && (
        <div style={{width:320,padding:24,background:'oklch(20% .04 155)',border:'1px solid rgba(255,255,255,0.1)',borderRadius:16,display:'flex',flexDirection:'column',gap:16,boxShadow:'0 10px 40px rgba(0,0,0,0.5)',animation:'pinShake 0.3s ease-out'}}>
          <div>
            <div style={{fontSize:16,fontWeight:700,color:'#fff',letterSpacing:'-0.2px'}}>Configurar Conexión Nube</div>
            <div style={{fontSize:11.5,color:'var(--g400)',marginTop:4}}>Pega el objeto JSON de tu configuración de Firebase:</div>
          </div>

          <textarea
            value={configInput}
            onChange={e=>setConfigInput(e.target.value)}
            placeholder={`{\n  "apiKey": "AIzaSy...",\n  "authDomain": "...",\n  "projectId": "...",\n  "appId": "..."\n}`}
            style={{
              width:'100%',
              height:160,
              background:'rgba(0,0,0,0.2)',
              border:'1px solid rgba(255,255,255,0.15)',
              borderRadius:8,
              padding:10,
              color:'#fff',
              fontSize:11,
              fontFamily:'\'DM Mono\', monospace',
              resize:'none',
              outline:'none'
            }}
          />

          {configError && <div style={{fontSize:11,color:'var(--red)',fontWeight:600}}>{configError}</div>}

          <div style={{display:'flex',gap:10}}>
            <button 
              onClick={handleSaveConfig}
              style={{flex:1,height:36,background:'oklch(60% .14 155)',border:'none',borderRadius:8,color:'#fff',fontWeight:600,fontSize:12,cursor:'pointer'}}
            >
              Guardar
            </button>
            <button 
              onClick={()=>setShowConfigForm(false)}
              style={{flex:1,height:36,background:'rgba(255,255,255,0.07)',border:'1px solid rgba(255,255,255,0.1)',borderRadius:8,color:'rgba(255,255,255,0.7)',fontWeight:600,fontSize:12,cursor:'pointer'}}
            >
              Cancelar
            </button>
          </div>
        </div>
      )}

      {/* Configure Cloud button at bottom */}
      {!showConfigForm && (
        <button 
          onClick={()=>setShowConfigForm(true)}
          style={{
            position:'absolute',
            bottom:24,
            background:'none',
            border:'none',
            color:'var(--g500)',
            fontSize:11.5,
            fontWeight:500,
            cursor:'pointer',
            textDecoration:'underline',
            transition:'color 0.15s'
          }}
          onMouseEnter={e=>e.target.style.color='#fff'}
          onMouseLeave={e=>e.target.style.color='var(--g500)'}
        >
          {isFirebaseConfigured ? '⚙️ Modificar Configuración Cloud' : '☁️ Conectar Servidor Nube (Firebase)'}
        </button>
      )}

      <style>{`@keyframes pinShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}`}</style>
    </div>
  );
}

function App() {
  const [locked, setLocked] = useState(true);
  const [col,setCol] = useState(false);
  const [active,setActive] = useState('mov'); // 'mov' (Movimientos) es la página de inicio (antes era 'home'/Resumen, ya removido)
  const [umbrales, setUmbrales] = useState(DEFAULT_UMBRALES);
  const [dismissedAlerts, setDismissedAlerts] = useState([]);

  // ── Firebase Auth & Sync Estados y Funciones ──
  const [fbUser, setFbUser] = useState(null);
  const [fbLoading, setFbLoading] = useState(false);
  const [isFirebaseConfigured, setIsFirebaseConfigured] = useState(() => isFirebaseAvailable());
  const [apiKey, setApiKey] = useState(() => localStorage.getItem('GEMINI_API_KEY') || 'AIzaSyBtSZRpBnkfBaCzxkeFptH9qTpu609JK70');
  
  // Whitelist de Accesos
  const [allowedModules, setAllowedModules] = useState(['mov']);
  const [fbUserRole, setFbUserRole] = useState('Visualizador');
  const [accessDeniedReason, setAccessDeniedReason] = useState(null); // 'not_allowed' | 'suspended' | null
  const [accessDeniedMessage, setAccessDeniedMessage] = useState('');
  const [lastFailedUser, setLastFailedUser] = useState(null); // { email, nombre }
  const [pendingRequestsCount, setPendingRequestsCount] = useState(0);
  
  const [manualAdjustments, setManualAdjustments] = useState(() => {
    try {
      const saved = localStorage.getItem('MANUAL_ADJUSTMENTS');
      return saved ? JSON.parse(saved) : [];
    } catch(e) {
      return [];
    }
  });
  
  const [reconciliations, setReconciliations] = useState(() => {
    try {
      const saved = localStorage.getItem('RECONCILIATIONS');
      return saved ? JSON.parse(saved) : {};
    } catch(e) {
      return {};
    }
  });
  
  const [auditLogs, setAuditLogs] = useState([]);
  const [nominaVer, setNominaVer] = useState(0);
  const [saldos, setSaldos] = useState(SALDOS_BANCO);
  const [movRecientes, setMovRecientes] = useState(MOV_RECIENTES);
  const [movByMonth, setMovByMonth] = useState(MOV_BY_MONTH);
  const [dataLoaded, setDataLoaded] = useState(false);
  const [showAlertCfg, setShowAlertCfg] = useState(false);
  const [showUpload, setShowUpload] = useState(false);
  const [showUploadVentas, setShowUploadVentas] = useState(false);
  const [showUploadNomina, setShowUploadNomina] = useState(false);

  // Audit Log recording helper
  const logAuditEvent = async (action, type = 'general') => {
    if (!db) return;
    const user = firebase.auth().currentUser;
    if (!user) return;
    try {
      const newLog = {
        timestamp: new Date().toISOString(),
        usuario: user.displayName || user.email || 'Usuario Autorizado',
        email: user.email,
        accion: action,
        tipo: type
      };
      
      const updatedLogs = [newLog, ...auditLogs].slice(0, 50); // Keep last 50 logs
      setAuditLogs(updatedLogs);
      await saveConfigToCloud(null, null, { auditLogs: updatedLogs });
    } catch (e) {
      console.error("Error al registrar evento de auditoría:", e);
    }
  };

  const handleRequestAccess = async (failedUser) => {
    if (!db || !failedUser || !failedUser.email) return;
    const emailClean = failedUser.email.toLowerCase().trim();
    try {
      await db.collection("access_requests").doc(emailClean).set({
        email: emailClean,
        nombre: failedUser.nombre || emailClean,
        fechaSolicitud: firebase.firestore.FieldValue.serverTimestamp(),
        estado: 'pendiente'
      });

      await db.collection("mail").add({
        to: ['brandon.villarroelcl@gmail.com', 'vandito321@gmail.com'],
        message: {
          subject: '🔔 Nueva Solicitud de Acceso - Dashboard Financiero',
          html: `
            <div style="font-family: sans-serif; padding: 20px; color: #1e293b; background-color: #f8fafc; border-radius: 12px; border: 1px solid #e2e8f0;">
              <h2 style="color: oklch(52% .15 240); margin-top: 0;">Nueva solicitud de acceso recibida</h2>
              <p>El usuario <strong>${failedUser.nombre || emailClean}</strong> (${emailClean}) está intentando ingresar al Dashboard Financiero y ha solicitado permisos.</p>
              <p>Para gestionar esta solicitud, ingresa al panel de administración <strong>Accesos y Roles</strong> en el Dashboard Financiero.</p>
              <hr style="border: 0; border-top: 1px solid #e2e8f0; margin: 20px 0;" />
              <p style="font-size: 12px; color: #64748b; margin-bottom: 0;">Este es un correo automático enviado por tu Dashboard Financiero.</p>
            </div>
          `
        }
      });
      return true;
    } catch (err) {
      console.error("Error al solicitar acceso:", err);
      throw err;
    }
  };

  const saveApiKey = async (key) => {
    setApiKey(key);
    localStorage.setItem('GEMINI_API_KEY', key);
    if (fbUser) {
      await saveConfigToCloud({ geminiApiKey: key }, umbrales);
      await logAuditEvent(`Actualizó la clave API de Gemini Flash`, 'seguridad');
    }
  };

  const handleReinitFirebase = () => {
    setIsFirebaseConfigured(isFirebaseAvailable());
  };

  const handleGoogleLogin = async () => {
    if (!isFirebaseConfigured || typeof firebase === 'undefined') return;
    const provider = new firebase.auth.GoogleAuthProvider();
    provider.addScope('https://www.googleapis.com/auth/calendar.events');
    setFbLoading(true);
    setAccessDeniedReason(null);
    try {
      const result = await firebase.auth().signInWithPopup(provider);
      if (result && result.credential) {
        const token = result.credential.accessToken;
        sessionStorage.setItem('google_access_token', token);
        window.googleAccessToken = token;
        console.log("🎟️ Google access token stored from popup");
      }
    } catch (err) {
      console.warn("Popup blocked, trying redirect...", err);
      try {
        await firebase.auth().signInWithRedirect(provider);
      } catch (e2) {
        console.error("Login failed:", e2);
        setFbLoading(false);
        alert("Error de inicio de sesión: " + e2.message);
      }
    }
  };

  const handleGoogleLogout = async () => {
    if (confirm("¿Deseas cerrar la sesión de forma segura?")) {
      setFbLoading(true);
      try {
        if (firebaseUnsubscribe) {
          firebaseUnsubscribe();
          firebaseUnsubscribe = null;
        }
        await firebase.auth().signOut();
        sessionStorage.removeItem('google_access_token');
        delete window.googleAccessToken;
        setFbUser(null);
        setFbUserRole('Visualizador');
        setAllowedModules(['mov']);
        setAccessDeniedReason(null);
        localStorage.removeItem('GEMINI_API_KEY');
        window.location.reload();
      } catch (err) {
        console.error("Error logging out:", err);
        setFbLoading(false);
      }
    }
  };

  const handleSyncData = (cloudData) => {
    if (cloudData.settings) {
      if (cloudData.settings.geminiApiKey) {
        setApiKey(cloudData.settings.geminiApiKey);
        localStorage.setItem('GEMINI_API_KEY', cloudData.settings.geminiApiKey);
      }
    }
    if (cloudData.umbrales) {
      setUmbrales(cloudData.umbrales);
    }
    if (cloudData.manualAdjustments) {
      setManualAdjustments(cloudData.manualAdjustments);
      localStorage.setItem('MANUAL_ADJUSTMENTS', JSON.stringify(cloudData.manualAdjustments));
    }
    if (cloudData.reconciliations) {
      setReconciliations(cloudData.reconciliations);
      localStorage.setItem('RECONCILIATIONS', JSON.stringify(cloudData.reconciliations));
    }
    if (cloudData.auditLogs) {
      setAuditLogs(cloudData.auditLogs);
    }
    setFbLoading(false);
  };

  useEffect(() => {
    if (isFirebaseConfigured) {
      setFbLoading(true);
      const appInstance = initFirebaseInstance(
        async (user) => {
          if (user) {
            const email = user.email ? user.email.toLowerCase() : '';
            try {
              let doc = await db.collection("allowed_users").doc(email).get();
              
              // Lógica de bootstrap especial para brandon.villarroelcl@gmail.com
              if (!doc.exists && (email === 'brandon.villarroelcl@gmail.com' || email === 'vandito321@gmail.com')) {
                const bootstrapUser = {
                  email: email,
                  nombre: user.displayName || 'Brandon V.',
                  rol: 'Administrador',
                  modulos: ['home', 'mov', 'sim', 'tareas', 'gas', 'ven', 'fon', 'cre', 'fin', 'ia', 'cloud', 'usuarios'],
                  activo: true,
                  creadoEn: firebase.firestore.FieldValue.serverTimestamp()
                };
                await db.collection("allowed_users").doc(email).set(bootstrapUser);
                doc = await db.collection("allowed_users").doc(email).get();
              }
              
              if (doc.exists) {
                const data = doc.data();
                if (data.activo === false) {
                  setAccessDeniedReason('suspended');
                  setLastFailedUser({ email: user.email, nombre: user.displayName || user.email });
                  setFbUser(null);
                  setFbLoading(false);
                  setLocked(true);
                  await firebase.auth().signOut();
                } else {
                  setFbUser(user);
                  setFbUserRole(data.rol || 'Visualizador');
                  setAllowedModules(data.modulos && data.modulos.length ? data.modulos : ['mov']);
                  setAccessDeniedReason(null);
                  setLastFailedUser(null);
                  setLocked(false);
                }
              } else {
                setAccessDeniedReason('not_allowed');
                setLastFailedUser({ email: user.email, nombre: user.displayName || user.email });
                setFbUser(null);
                setFbLoading(false);
                setLocked(true);
                await firebase.auth().signOut();
              }
            } catch (err) {
              console.error("Error al validar whitelist de usuarios:", err);
              const errMsg = err.message || '';
              if (errMsg.includes('offline') || errMsg.includes('network') || errMsg.includes('Failed to get document')) {
                setAccessDeniedMessage("No se pudo conectar con el servidor de seguridad de Firebase. Si estás usando bloqueadores de anuncios (ad-blockers) o Brave Shield, por favor desactívalos para este sitio, ya que suelen bloquear las conexiones con Firebase Database (firestore.googleapis.com).");
              } else {
                setAccessDeniedMessage(err.message || "Error al verificar tus permisos de acceso.");
              }
              setAccessDeniedReason('connection_error');
              setFbUser(null);
              setFbLoading(false);
              setLocked(true);
              try {
                await firebase.auth().signOut();
              } catch(e) {
                console.error("SignOut failed during catch:", e);
              }
            }
          } else {
            setFbUser(null);
            setFbUserRole('Visualizador');
            setAllowedModules(['mov']);
            setLocked(true);
            setFbLoading(false);
          }
        },
        handleSyncData
      );
      if (!appInstance) {
        setFbLoading(false);
      }
    }
  }, [isFirebaseConfigured]);

  // Escuchador en tiempo real para solicitudes de acceso pendientes (solo para Administradores)
  useEffect(() => {
    if (!db || fbUserRole !== 'Administrador') {
      setPendingRequestsCount(0);
      return;
    }
    const unsubscribe = db.collection("access_requests")
      .where("estado", "==", "pendiente")
      .onSnapshot((snapshot) => {
        setPendingRequestsCount(snapshot.size);
      }, (err) => {
        console.error("Error al escuchar solicitudes pendientes:", err);
      });
    return unsubscribe;
  }, [fbUserRole]);

  // Enrutamiento seguro: Redirigir si se intenta acceder a una pestaña no permitida
  useEffect(() => {
    if (!locked && allowedModules && allowedModules.length > 0) {
      const allowed = allowedModules || ['mov'];
      // 'home' (Resumen) fue removido: si se intenta acceder, se trata como no permitido
      const isAllowed = active !== 'home' && allowed.includes(active) && (active !== 'usuarios' || fbUserRole === 'Administrador');
      if (!isAllowed) {
        const fallback = allowed.find(m => m !== 'home') || 'mov';
        setActive(fallback);
        localStorage.setItem('fdash_page', fallback);
      }
    }
  }, [active, allowedModules, fbUserRole, locked]);

  // Auto-integrar configuración de Firebase desde LocalStorage a index.html en disco
  useEffect(() => {
    const savedConfig = localStorage.getItem('FIREBASE_CONFIG');
    if (savedConfig) {
      try {
        const parsed = JSON.parse(savedConfig);
        if (parsed && parsed.apiKey && parsed.apiKey !== "TU_API_KEY_REAL") {
          if (DEFAULT_FIREBASE_CONFIG.apiKey === "TU_API_KEY_REAL") {
            console.log("Auto-integrando Firebase...");
            fetch('/api/save-config-to-disk', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(parsed)
            })

              if(cd&&cd.pending&&cd.pending.length){
                COB_PENDIENTES=cd.pending;
                if(cd.kpis)COB_KPIS=cd.kpis;
                if(cd.porMes)COB_POR_MES=cd.porMes;
                if(cd.porEj)COB_POR_EJECUTIVO=cd.porEj;
                if(cd.topClientes)COB_TOP_CLIENTES=cd.topClientes;
                setCobVersion(function(v){return v+1;});
                console.log('✅ COBRANZA cargada desde carga manual (nube):',cd.pending.length,'registros | Subido por:',cd.uploadedBy||'?');
              }
            }
          }
        }catch(e){console.warn('Cobranza manual (nube) no disponible:',e.message);}
      } catch(e){console.warn('Datos en vivo no disponibles:',e.message);}
      setDataLoaded(true);
    }
    const t = setTimeout(()=>setDataLoaded(true), 4000); // fallback si fetch cuelga

    const flaggedNewMovs = newMovs.map(m => ({

      isIntercompany: isIntercompanyTransfer(m.descripcion)

    setMovRecientes(prev => {
      const merged = [...flaggedNewMovs, ...prev];
      merged.sort((a,b)=>b.fecha.localeCompare(a.fecha));
      return merged;
    });
    const newByMonth = {...movByMonth};
    flaggedNewMovs.forEach(m => {
      const mes = m.fecha.slice(0,7);
      if (!newByMonth[mes]) newByMonth[mes] = {ingresos:0,gastos:0};
      // Excluir de totales mensuales
      if (m.isIntercompany) return;
      if (m.monto > 0) newByMonth[mes].ingresos += m.monto;

// ── Usuarios Page Component ──
function UsuariosPage({ fbUser, logAuditEvent, navItems }) {
  const [users, setUsers] = useState([]);
  const [loading, setLoading] = useState(true);
  const [search, setSearch] = useState('');
  
  // Modal state
  const [showModal, setShowModal] = useState(false);
  const [editingUser, setEditingUser] = useState(null);
  
  // Form states
  const [formEmail, setFormEmail] = useState('');
  const [formNombre, setFormNombre] = useState('');
  const [formRol, setFormRol] = useState('Visualizador');
  const [formModulos, setFormModulos] = useState(['home']);
  const [formActivo, setFormActivo] = useState(true);
  const [saving, setSaving] = useState(false);
  const [accessRequests, setAccessRequests] = useState([]);

  useEffect(() => {
    if (!db) return;
    const unsubscribe = db.collection("allowed_users").onSnapshot(
      (snapshot) => {
        const uList = [];
        snapshot.forEach(doc => {
          uList.push({ id: doc.id, ...doc.data() });
        });
        uList.sort((a, b) => {
          const tA = a.creadoEn ? (a.creadoEn.seconds * 1000 || new Date(a.creadoEn).getTime()) : 0;
          const tB = b.creadoEn ? (b.creadoEn.seconds * 1000 || new Date(b.creadoEn).getTime()) : 0;
          return tB - tA;
        });
        setUsers(uList);
        setLoading(false);
      },
      (err) => {
        console.error("Error fetching users:", err);
        setLoading(false);
      }
    );
    return unsubscribe;
  }, []);

  useEffect(() => {
    if (!db) return;
    const unsubscribe = db.collection("access_requests")
      .where("estado", "==", "pendiente")
      .onSnapshot(
        (snapshot) => {
          const reqs = [];
          snapshot.forEach(doc => {
            reqs.push({ id: doc.id, ...doc.data() });
          });
          reqs.sort((a, b) => {
            const tA = a.fechaSolicitud ? (a.fechaSolicitud.seconds * 1000 || new Date(a.fechaSolicitud).getTime()) : 0;
            const tB = b.fechaSolicitud ? (b.fechaSolicitud.seconds * 1000 || new Date(b.fechaSolicitud).getTime()) : 0;
            return tB - tA;
          });
          setAccessRequests(reqs);
        },
        (err) => {
          console.error("Error fetching access requests:", err);
        }
      );
    return unsubscribe;
  }, []);

  const handleApproveRequest = async (request) => {
    if (!db) return;
    const emailClean = request.email.toLowerCase().trim();
    
    // Helper para evitar bloqueos
    const withTimeout = (promise, ms, name) => {
      let timeoutId;
      const timeoutPromise = new Promise((_, reject) => {
        timeoutId = setTimeout(() => {
          reject(new Error(`La operación '${name}' tardó demasiado (${ms}ms). Posible desconexión.`));
        }, ms);
      });
      return Promise.race([
        promise.then(res => { clearTimeout(timeoutId); return res; }),
        timeoutPromise
      ]);
    };

    try {
      const token = await firebase.auth().currentUser.getIdToken();
      
      console.log("[Aprobar] Escribiendo en allowed_users (REST API)...");
      const isoDate = new Date().toISOString();
      const userPayload = {
        fields: {
          email: { stringValue: emailClean },
          nombre: { stringValue: request.nombre || emailClean },
          rol: { stringValue: 'Visualizador' },
          activo: { booleanValue: true },
          modulos: { arrayValue: { values: [{ stringValue: 'home' }, { stringValue: 'mov' }] } },
          creadoEn: { timestampValue: isoDate }
        }
      };
      
      let restUrl = `https://firestore.googleapis.com/v1/projects/dashboard-93457/databases/(default)/documents/allowed_users/${encodeURIComponent(emailClean)}?updateMask.fieldPaths=email&updateMask.fieldPaths=nombre&updateMask.fieldPaths=rol&updateMask.fieldPaths=activo&updateMask.fieldPaths=modulos&updateMask.fieldPaths=creadoEn`;
      let resp = await fetch(restUrl, { method: 'PATCH', headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' }, body: JSON.stringify(userPayload) });
      if (!resp.ok) throw new Error("Fallo al escribir allowed_users: " + await resp.text());
      
      console.log("[Aprobar] Actualizando access_requests (REST API)...");
      const requestPayload = {
        fields: {
          estado: { stringValue: 'aprobado' },
          aprobadoPor: { stringValue: fbUser ? fbUser.email : 'Administrador' },
          fechaResolucion: { timestampValue: isoDate }
        }
      };
      restUrl = `https://firestore.googleapis.com/v1/projects/dashboard-93457/databases/(default)/documents/access_requests/${encodeURIComponent(emailClean)}?updateMask.fieldPaths=estado&updateMask.fieldPaths=aprobadoPor&updateMask.fieldPaths=fechaResolucion`;
      resp = await fetch(restUrl, { method: 'PATCH', headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' }, body: JSON.stringify(requestPayload) });
      if (!resp.ok) throw new Error("Fallo al actualizar access_requests: " + await resp.text());
      
      console.log("[Aprobar] Registrando auditoría...");
      await logAuditEvent(`Aprobó acceso para el usuario solicitante ${emailClean} con rol Visualizador`, 'seguridad');
      
      alert(`✅ Acceso aprobado con éxito para ${emailClean}.`);
    } catch (err) {
      console.error("Error al aprobar solicitud:", err);
      alert("Error crítico al aprobar acceso:\n" + err.message);
    }
  };

  const handleRejectRequest = async (request) => {
    if (!db) return;
    if (!confirm(`¿Estás seguro de que deseas rechazar la solicitud de acceso de ${request.email}?`)) return;
    const emailClean = request.email.toLowerCase().trim();
    
    const withTimeout = (promise, ms, name) => {
      let timeoutId;
      const timeoutPromise = new Promise((_, reject) => {
        timeoutId = setTimeout(() => reject(new Error(`La operación '${name}' tardó demasiado.`)), ms);
      });
      return Promise.race([ promise.then(res => { clearTimeout(timeoutId); return res; }), timeoutPromise ]);
    };

    try {
      await withTimeout(db.collection("access_requests").doc(emailClean).update({
        estado: 'rechazado',
        rechazadoPor: fbUser ? fbUser.email : 'Administrador',
        fechaResolucion: firebase.firestore.FieldValue.serverTimestamp()
      }), 8000, 'update access_requests');
      await logAuditEvent(`Rechazó acceso para el usuario solicitante ${emailClean}`, 'seguridad');
      alert(`🔴 Solicitud de ${emailClean} rechazada.`);
    } catch (err) {
      console.error("Error al rechazar solicitud:", err);
      alert("Error crítico al rechazar acceso:\n" + err.message);
    }
  };

  const handleOpenAdd = () => {
    setEditingUser(null);
    setFormEmail('');
    setFormNombre('');
    setFormRol('Visualizador');
    setFormModulos(['home', 'mov']);
    setFormActivo(true);
    setShowModal(true);
  };

  const handleOpenEdit = (user) => {
    setEditingUser(user);
    setFormEmail(user.email);
    setFormNombre(user.nombre || '');
    setFormRol(user.rol || 'Visualizador');
    setFormModulos(user.modulos && user.modulos.length ? user.modulos : ['home']);

  const handleToggleActive = async (user) => {
    if (!db) return;
    const currentEmail = fbUser ? fbUser.email.toLowerCase() : '';
    if (user.email.toLowerCase() === currentEmail) {
      alert("⚠️ No puedes desactivar tu propio acceso.");
      return;
    }
    // Prevent suspending support admins
    if (user.email.toLowerCase() === 'brandon.villarroelcl@gmail.com' || user.email.toLowerCase() === 'vandito321@gmail.com') {
      alert("⚠️ No se puede desactivar la cuenta del superadministrador inicial.");
      return;
    }

    const newStatus = !user.activo;
    try {
      await db.collection("allowed_users").doc(user.email.toLowerCase()).update({
        activo: newStatus
      });
      await logAuditEvent(`${newStatus ? 'Activó' : 'Suspendió'} el acceso al usuario ${user.email}`, 'seguridad');
    } catch (e) {
      console.error(e);
      alert("Error al actualizar estado: " + e.message);
    }
  };

  const handleDeleteUser = async (user) => {
    if (!db) return;
    const currentEmail = fbUser ? fbUser.email.toLowerCase() : '';
    if (user.email.toLowerCase() === currentEmail) {
      alert("⚠️ No puedes eliminar tu propio acceso.");
      return;
    }
    if (user.email.toLowerCase() === 'brandon.villarroelcl@gmail.com' || user.email.toLowerCase() === 'vandito321@gmail.com') {

    if (confirm(`¿Estás seguro de que deseas eliminar permanentemente el acceso para ${user.nombre || user.email}?`)) {

  const handleSave = async (e) => {
    e.preventDefault();
    if (!db) return;
    
    const emailClean = formEmail.trim().toLowerCase();
    const nombreClean = formNombre.trim();
    
    if (!emailClean || !nombreClean) {
      alert("⚠️ Por favor ingresa el correo y el nombre.");
      return;
    }

    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    if (!emailRegex.test(emailClean)) {
      alert("⚠️ El formato del correo electrónico no es válido.");
      return;
    }

    if (formModulos.length === 0) {
      alert("⚠️ Debes autorizar al menos 1 módulo.");
      return;
    }

    const currentEmail = fbUser ? fbUser.email.toLowerCase() : '';

      if (!formModulos.includes('usuarios')) {
        alert("⚠️ No puedes quitarte el permiso al módulo de Accesos y Roles a ti mismo.");
        return;

    }

    setSaving(true);
    console.log("[handleSave] Iniciando guardado para:", emailClean);
    
    // Forzar reconexión explícita a la red en caso de que Firebase se haya dormido o desconectado
    try {
      await db.enableNetwork();
      console.log("[handleSave] Red forzada a ON.");
    } catch(e) {
      console.warn("No se pudo forzar la red:", e);
    }
    
    // Función helper para evitar cuelgues infinitos (timeout de 8 segundos)
    const withTimeout = (promise, ms, name) => {
      let timeoutId;
      const timeoutPromise = new Promise((_, reject) => {
        timeoutId = setTimeout(() => {
          reject(new Error(`La operación '${name}' superó el tiempo de espera de ${ms}ms. Probablemente Firebase esté desconectado (offline).`));
        }, ms);
      });
      return Promise.race([
        promise.then(res => { clearTimeout(timeoutId); return res; }),
        timeoutPromise
      ]);
    };

    try {
      const isoDate = new Date().toISOString();
      const userPayload = {
        email: emailClean,
        nombre: nombreClean,
        rol: formRol,
        modulos: formModulos,
        activo: formActivo,
        actualizadoEn: isoDate
      };

      if (!editingUser) {
        console.log("[handleSave] Revisando si el usuario ya existe...");
        const check = await withTimeout(db.collection("allowed_users").doc(emailClean).get(), 8000, 'get allowed_users');
        if (check.exists) {
          alert(`⚠️ Ya existe un usuario registrado con el correo: ${emailClean}`);
          setSaving(false);
          return;
        }
        userPayload.creadoEn = isoDate;
      }

      console.log("[handleSave] Guardando en allowed_users (Vía REST API)...");
      const token = await firebase.auth().currentUser.getIdToken();
      
      const firestorePayload = {
        fields: {
          email: { stringValue: userPayload.email },
          nombre: { stringValue: userPayload.nombre },
          rol: { stringValue: userPayload.rol },
          activo: { booleanValue: userPayload.activo },
          modulos: {
            arrayValue: { values: userPayload.modulos.map(m => ({ stringValue: m })) }
          },
          actualizadoEn: { timestampValue: userPayload.actualizadoEn }
        }
      };
      if (userPayload.creadoEn) {
        firestorePayload.fields.creadoEn = { timestampValue: userPayload.creadoEn };
      }

      const restUrl = `https://firestore.googleapis.com/v1/projects/dashboard-93457/databases/(default)/documents/allowed_users/${encodeURIComponent(emailClean)}?updateMask.fieldPaths=email&updateMask.fieldPaths=nombre&updateMask.fieldPaths=rol&updateMask.fieldPaths=activo&updateMask.fieldPaths=modulos&updateMask.fieldPaths=actualizadoEn` + (userPayload.creadoEn ? `&updateMask.fieldPaths=creadoEn` : ``);

      const response = await fetch(restUrl, {
        method: 'PATCH',
        headers: {
          'Authorization': `Bearer ${token}`,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(firestorePayload)
      });

      if (!response.ok) {
        const errText = await response.text();
        throw new Error(`Fallo de red en REST API: ${response.status} - ${errText}`);
      }
      console.log("[handleSave] Guardado en REST exitoso.");

      console.log("[handleSave] Registrando auditoría...");
      await logAuditEvent(`${editingUser ? 'Actualizó' : 'Creó'} acceso para el usuario ${emailClean} (${formRol})`, 'seguridad');
      
      console.log("[handleSave] Guardado exitoso.");
      setShowModal(false);
    } catch (e) {
      console.error("[handleSave] ERROR ATRACHADO:", e);
      alert("Error crítico al guardar usuario:\n\n" + e.message);
    } finally {
