// ── Runway Simulator Page Component ──
function RunwaySimulatorPage({ saldos, movRecientes }) {
  const [probabilidad, setProbabilidad] = useState(80);
  const [plazo, setPlazo] = useState('15d'); // por defecto 15 días (diario); opciones: '15d', '1m', '2m', '3m', '6m', '12m'
  const [incluirFfmm, setIncluirFfmm] = useState(false);
  const [incluirSueldos, setIncluirSueldos] = useState(true);
  const [incluirCreditos, setIncluirCreditos] = useState(true);
  const [incluirFijos, setIncluirFijos] = useState(true);
  const [incluirFiniquitos, setIncluirFiniquitos] = useState(true);
  const [incluirGastos, setIncluirGastos] = useState(true);

  const movList = movRecientes || MOV_RECIENTES;
  const totalCaja = Object.values(saldos || SALDOS_BANCO).reduce((a, b) => a + b, 0);
  const totalInversiones = FONDOS.length > 0 ? FONDOS[FONDOS.length - 1].total : 0;
  
  const currentCash = totalCaja + (incluirFfmm ? totalInversiones : 0);

  // Proyección de plazos dinámicos (Diario vs Mensual)
  const { monthsLabels, projectedBalances, timelineData } = useMemo(() => {
    let startDate = new Date();
    if (movList.length > 0 && movList[0].fecha) {
      const d = new Date(movList[0].fecha + 'T12:00:00');
      if (!isNaN(d.getTime())) {
        startDate = d;
      }
    }

    const monthsNames = ['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun', 'Jul', 'Ago', 'Sep', 'Oct', 'Nov', 'Dic'];
    const labels = [];
    const balances = [];
    const tableRows = [];
    
    let currentBalance = currentCash;
    const probFactor = probabilidad / 100;
    
    const isDaily = plazo === '15d' || plazo === '1m';
    const numSteps = plazo === '15d' ? 15 : (plazo === '1m' ? 30 : (plazo === '2m' ? 2 : (plazo === '3m' ? 3 : (plazo === '6m' ? 6 : 12))));

    // Sueldos y costos fijos mensuales (usados en modo mensual)
    const sueldosMensual = incluirSueldos ? NOMINA_DATA.reduce((s, e) => s + e.monto, 0) : 0;
    const anticiposMensual = incluirSueldos ? ANTICIPOS_DATA.reduce((s, e) => s + e.monto, 0) : 0;
    const fijosMensual = incluirFijos ? GASTOS_FIJOS_DATA.reduce((s, f) => s + f.monto, 0) : 0;

    if (isDaily) {
      for (let i = 1; i <= numSteps; i++) {
        const projDate = new Date(startDate.getFullYear(), startDate.getMonth(), startDate.getDate() + i, 12, 0, 0);
        const mLabel = projDate.toLocaleDateString('es-CL', { day: '2-digit', month: 'short' });
        labels.push(mLabel);

        // 1. Cobranza vencida este día
        const cobranzasDia = COB_PENDIENTES.filter(c => {
          if (c.estado !== 'VENCIDO' || !c.vencimiento) return false;
          const d = new Date(c.vencimiento + 'T12:00:00');
          return d.getFullYear() === projDate.getFullYear() && d.getMonth() === projDate.getMonth() && d.getDate() === projDate.getDate();
        });
        const cobranzaRawSum = cobranzasDia.reduce((s, c) => s + c.saldo, 0);
        const cobranzaProyectada = Math.round(cobranzaRawSum * probFactor);

        // 2. Gastos Variables este día
        const gastosDia = incluirGastos ? GASTOS.filter(g => {
          if ((g.estado && g.estado.toLowerCase() === 'pagado') || !g.fecha) return false;
          const d = new Date(g.fecha + 'T12:00:00');
          return d.getFullYear() === projDate.getFullYear() && d.getMonth() === projDate.getMonth() && d.getDate() === projDate.getDate();
        }).reduce((s, g) => s + g.monto, 0) : 0;

        // 3. Créditos este día
        const creditosDia = incluirCreditos ? CREDITOS_SHEETS_RAW.filter(c => {
          if (c.estado === 'Pagado' || !c.fecha) return false;
          const d = new Date(c.fecha + 'T12:00:00');
          return d.getFullYear() === projDate.getFullYear() && d.getMonth() === projDate.getMonth() && d.getDate() === projDate.getDate();
        }).reduce((s, c) => s + c.montoPago, 0) : 0;

        // 4. Finiquitos este día
        const finiquitosDia = incluirFiniquitos ? FINIQUITOS_RAW.filter(f => {
          if (f.estado === 'Pagado' || !f.fecha) return false;
          const d = new Date(f.fecha + 'T12:00:00');
          return d.getFullYear() === projDate.getFullYear() && d.getMonth() === projDate.getMonth() && d.getDate() === projDate.getDate();
        }).reduce((s, f) => s + f.montoPago, 0) : 0;

        // 5. Sueldos el día 30 (fin de mes); Anticipos el día 15 (mitad de mes) — fechas de pago distintas
        const isSueldosDay = projDate.getDate() === 30;
        const isAnticiposDay = projDate.getDate() === 15;
        const sueldosDia = (incluirSueldos && isSueldosDay) ? NOMINA_DATA.reduce((s, e) => s + e.monto, 0) : 0;
        const anticiposDia = (incluirSueldos && isAnticiposDay) ? ANTICIPOS_DATA.reduce((s, e) => s + e.monto, 0) : 0;

        // 6. Gastos Fijos este día
        const fijosDia = incluirFijos ? GASTOS_FIJOS_DATA.filter(g => g.dia_pago === projDate.getDate()).reduce((s, f) => s + f.monto, 0) : 0;

        const totalEgresosMes = sueldosDia + anticiposDia + fijosDia + creditosDia + finiquitosDia + gastosDia;
        const saldoInicial = currentBalance;
        const flujoNeto = cobranzaProyectada - totalEgresosMes;
        currentBalance += flujoNeto;

        balances.push(currentBalance);

        tableRows.push({
          label: mLabel,
          inicial: saldoInicial,
          cobros: cobranzaProyectada,
          fijos: fijosDia + finiquitosDia,
          cheques: gastosDia,
          nomina: sueldosDia + anticiposDia,
          creditos: creditosDia,
          flujo: flujoNeto,
          final: currentBalance
        });
      }
    } else {
      // Modo Mensual
      const startYear = startDate.getFullYear();
      const startMonth = startDate.getMonth();

      for (let m = 0; m < numSteps; m++) {
        const projDate = new Date(startYear, startMonth + m, 15, 12, 0, 0);
        const mLabel = `${monthsNames[projDate.getMonth()]} ${projDate.getFullYear()}`;
        labels.push(mLabel);

        const targetMonth = projDate.getMonth();
        const targetYear = projDate.getFullYear();

        // 1. Cobranza vencida este mes
        const cobranzasMes = COB_PENDIENTES.filter(c => {
          if (c.estado !== 'VENCIDO' || !c.vencimiento) return false;
          const d = new Date(c.vencimiento + 'T12:00:00');
          return d.getMonth() === targetMonth && d.getFullYear() === targetYear;
        });
        const cobranzaRawSum = cobranzasMes.reduce((s, c) => s + c.saldo, 0);
        const cobranzaProyectada = Math.round(cobranzaRawSum * probFactor);

        // 2. Gastos Variables
        const gastosMes = incluirGastos ? GASTOS.filter(g => {
          if ((g.estado && g.estado.toLowerCase() === 'pagado') || !g.fecha) return false;
          const d = new Date(g.fecha + 'T12:00:00');
          return d.getMonth() === targetMonth && d.getFullYear() === targetYear;
        }).reduce((s, g) => s + g.monto, 0) : 0;

        // 3. Créditos
        const creditosMes = incluirCreditos ? CREDITOS_SHEETS_RAW.filter(c => {
          if (c.estado === 'Pagado' || !c.fecha) return false;
          const d = new Date(c.fecha + 'T12:00:00');
          return d.getMonth() === targetMonth && d.getFullYear() === targetYear;
        }).reduce((s, c) => s + c.montoPago, 0) : 0;

        // 4. Finiquitos
        const finiquitosMes = incluirFiniquitos ? FINIQUITOS_RAW.filter(f => {
          if (f.estado === 'Pagado' || !f.fecha) return false;
          const d = new Date(f.fecha + 'T12:00:00');
          return d.getMonth() === targetMonth && d.getFullYear() === targetYear;
        }).reduce((s, f) => s + f.montoPago, 0) : 0;

        const totalEgresosMes = sueldosMensual + anticiposMensual + fijosMensual + creditosMes + finiquitosMes + gastosMes;
        const saldoInicial = currentBalance;
        const flujoNeto = cobranzaProyectada - totalEgresosMes;
        currentBalance += flujoNeto;

        balances.push(currentBalance);

        tableRows.push({
          label: mLabel,
          inicial: saldoInicial,
          cobros: cobranzaProyectada,

  const executeCustomQuery = (queryInput) => {
    if (!queryInput.trim()) return;
    setIsTyping(true);
    setChatResponse(null);

    const query = cleanText(queryInput);

    // Call Gemini API if Key is present
    if (apiKey.trim()) {
      const systemPrompt = buildSystemPrompt();
      const context = buildContext();
      const prompt = `${systemPrompt}\n\nCONTEXTO FINANCIERO:\n${context}\n\nPREGUNTA DEL USUARIO:\n${queryInput}`;

      fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent?key=${apiKey.trim()}`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          contents: [{
            parts: [{ text: prompt }]
          }],
          generationConfig: {
            temperature: 0.15
          }
        })
      })
      .then(res => {
        if (!res.ok) throw new Error(`Error API (${res.status})`);
        return res.json();
      })
      .then(data => {
        setIsTyping(false);
        const reply = data.candidates?.[0]?.content?.parts?.[0]?.text;
        if (reply) {
          let cleanReply = reply.trim();
          if (cleanReply.startsWith("```html")) {
            cleanReply = cleanReply.slice(7);
          }
          if (cleanReply.endsWith("```")) {
            cleanReply = cleanReply.slice(0, -3);
          }
          setChatResponse(cleanReply);
        } else {
          throw new Error("Respuesta vacía o inválida");
        }
      })
      .catch(err => {
        console.error("Gemini Flash failed, running offline fallback:", err);
        const fallbackText = runOfflineQuery(query, queryInput, err.message);
        setIsTyping(false);
        setChatResponse(fallbackText);
      });

      return;
    }

    // Si no hay API Key, ejecutar offline directamente
    const text = runOfflineQuery(query, queryInput);
    setTimeout(() => {
      setIsTyping(false);
      setChatResponse(text);
    }, 600);
  };

  const [configInput, setConfigInput] = useState(() => config ? JSON.stringify(config, null, 2) : '');
  const [showConfigForm, setShowConfigForm] = useState(!isFirebaseConfigured);

  const handleSaveConfig = () => {
    try {
      let cleanInput = configInput.trim();
      let parsed = null;
      try {
        parsed = JSON.parse(cleanInput);
      } catch (err) {
        // Relaxed parser for copy-pasted JavaScript config objects from Firebase Console
        const configObj = {};
        const keys = ['apiKey', 'authDomain', 'projectId', 'storageBucket', 'messagingSenderId', 'appId'];
        keys.forEach(k => {
          const match = cleanInput.match(new RegExp(`['"]?${k}['"]?\\s*:\\s*['"]([^'"]+)['"]`));
          if (match && match[1]) configObj[k] = match[1].trim();
        });
        if (configObj.apiKey && configObj.projectId && configObj.authDomain) {
          parsed = configObj;
        }
      }

      if (!parsed || !parsed.apiKey || !parsed.projectId || !parsed.authDomain) {
        alert("⚠️ Objeto de configuración de Firebase inválido o incompleto. Debe contener al menos apiKey, authDomain y projectId.");
        return;
      }

      localStorage.setItem('FIREBASE_CONFIG', JSON.stringify(parsed));
      alert("✅ Configuración de Firebase guardada con éxito. La página se recargará para aplicar los cambios.");
      window.location.reload();
    } catch (e) {
      alert("❌ Error al procesar la configuración: " + e.message);
    }
  };

    if (confirm("⚠️ ¿Estás seguro de que deseas desconectar y eliminar las credenciales de Firebase de este navegador?\n\nSe cerrará la sesión y volverá al PIN offline.")) {

              )}
            </div>

            <div className="cloud-sync-item">
              <div>
                <div style={{ fontSize: 13, fontWeight: 600, color: 'var(--text)' }}>🎨 Preferencias Generales</div>
                <div style={{ fontSize: 11.5, color: 'var(--text-secondary)', marginTop: 2 }}>Esquema de color y vistas predeterminadas</div>
              </div>
              {fbUser ? (
                <span className="cloud-badge-success">Respaldado</span>
              ) : (
                <span style={{ fontSize: 11.5, color: 'var(--text-light)' }}>Solo local</span>
              )}
            </div>
          </div>

          <div className="cloud-card">
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 16 }}>
              <h3 style={{ fontFamily: 'var(--font-headings)', fontSize: 16, fontWeight: 700, color: 'var(--text)', margin: 0 }}>
                Servidor Cloud Firebase
              </h3>
              {isFirebaseConfigured && (
                <button 
                  onClick={() => setShowConfigForm(!showConfigForm)}
                  style={{
                    background: 'none', border: 'none', color: 'var(--primary)',
                    fontSize: 12.5, fontWeight: 600, cursor: 'pointer', fontFamily: 'var(--font-main)'
                  }}
                >
                  {showConfigForm ? 'Cancelar' : '⚙️ Editar Credenciales'}
                </button>
              )}
            </div>

            {showConfigForm ? (
              <div style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
                <p style={{ fontSize: 12.5, color: 'var(--text-secondary)', lineHeight: 1.4 }}>
                  Pega el objeto JSON de tu aplicación web de Firebase (desde la Consola de Firebase &gt; Configuración del proyecto):
                </p>
                
                <textarea 
                  className="cloud-input"
                  rows="7"
                  placeholder={`{\n  "apiKey": "AIzaSy...",\n  "authDomain": "tu-proyecto.firebaseapp.com",\n  "projectId": "tu-proyecto",\n  "storageBucket": "tu-proyecto.firebasestorage.app",\n  "messagingSenderId": "...",\n  "appId": "..."\n}`}
                  value={configInput}
                  onChange={(e) => setConfigInput(e.target.value)}
                />

                <div style={{ display: 'flex', gap: 10, marginTop: 4 }}>
                  <button className="cloud-btn-primary" onClick={handleSaveConfig} style={{ flex: 1 }}>
                    Guardar Configuración
                  </button>
                  {isFirebaseConfigured && (
                    <button className="cloud-btn-danger-outline" onClick={handleDisconnectFirebase}>
                      Desconectar
                    </button>
                  )}
                </div>
              </div>
            ) : (
              <div>
                <p style={{ fontSize: 12.5, color: 'var(--text-secondary)', lineHeight: 1.4, marginBottom: 12 }}>
                  Tu dashboard está conectado al proyecto de Firebase: <strong style={{ color: 'var(--text)' }}>{config?.projectId || 'Desconocido'}</strong>.
                </p>
                <div style={{ 
                  background: 'var(--background)', border: '1px solid var(--border)', 
                  borderRadius: '6px', padding: '10px 14px', fontSize: 12, color: 'var(--text-secondary)'
                }}>
                  <div style={{ marginBottom: 4 }}><strong>API Key:</strong> ••••••••••••••••••••••</div>
                  <div><strong>Auth Domain:</strong> {config?.authDomain}</div>
                </div>
              </div>
            )}
          </div>

          {isFirebaseConfigured && (
            <div className="cloud-card" style={{ marginTop: 20 }}>
              <h3 style={{ fontFamily: 'var(--font-headings)', fontSize: 16, fontWeight: 700, marginBottom: 16, color: 'var(--text)' }}>
                📜 Bitácora de Actividad Reciente
              </h3>
              
              {!auditLogs || auditLogs.length === 0 ? (
                <div style={{ fontSize: 13, color: 'var(--t3)', fontStyle: 'italic', textAlign: 'center', padding: '16px 0' }}>
                  Sin eventos de auditoría registrados.
                </div>
              ) : (
                <div style={{ display: 'flex', flexDirection: 'column', gap: 14, maxHeight: 300, overflowY: 'auto', paddingRight: 6 }}>
                  {auditLogs.map((log, idx) => {
                    const isAjuste = log.tipo === 'ajuste';
                    const isConcil = log.tipo === 'conciliacion';
                    const isSeg = log.tipo === 'seguridad';
                    
                    const dotColor = isAjuste ? 'var(--primary)' : isConcil ? '#059669' : isSeg ? '#7c3aed' : 'var(--t3)';
                    const bgBadge = isAjuste ? 'var(--primary-light)' : isConcil ? '#ecfdf5' : isSeg ? '#f5f3ff' : 'var(--background)';
                    const borderBadge = isAjuste ? 'rgba(37,99,235,0.1)' : isConcil ? 'rgba(5,150,105,0.1)' : isSeg ? 'rgba(124,58,237,0.1)' : 'var(--border)';
                    
                    return (
                      <div key={idx} style={{ display: 'flex', gap: 12, position: 'relative' }}>
                        {idx !== auditLogs.length - 1 && (
                          <div style={{ position: 'absolute', left: 5, top: 12, bottom: -20, width: 2, background: 'var(--border)' }} />
                        )}
                        <div style={{ width: 10, height: 10, borderRadius: '50%', background: dotColor, marginTop: 4, zIndex: 1, border: '2px solid var(--surface)' }} />
                        <div style={{ flex: 1 }}>
                          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                            <span style={{ fontSize: 11, fontWeight: 700, color: 'var(--text)' }}>{log.usuario}</span>
                            <span style={{ fontSize: 10.5, color: 'var(--t3)' }}>
                              {new Date(log.timestamp).toLocaleDateString('es-CL', { day: '2-digit', month: 'short' })} a las {new Date(log.timestamp).toLocaleTimeString('es-CL', { hour: '2-digit', minute: '2-digit' })}
                            </span>
                          </div>
                          <p style={{ fontSize: 12, color: 'var(--text-secondary)', marginTop: 2, lineHeight: 1.3 }}>
                            {log.accion}
                          </p>
                          <span style={{ 
                            display: 'inline-block', fontSize: 9, fontWeight: 700, 
                            color: dotColor, background: bgBadge, border: `1px solid ${borderBadge}`,
                            padding: '1px 6px', borderRadius: 4, marginTop: 4, textTransform: 'uppercase'
                          }}>
                            {log.tipo}
                          </span>
                        </div>
                      </div>
                    );
                  })}
                </div>
              )}
            </div>
          )}

        </div>

      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
